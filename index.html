<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3b0f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samba">
<title>Samba da Tânia</title>
<style>
:root{--bg:#3b0f26;--bg2:#5a1a3a;--gold:#f2c14e;--felt:#0f5a43;--felt2:#0b4633;--rim:#7a4a1d;--back1:#8a2a55;--back2:#6c1d41;--ink:#1d1d1d;--red:#c62839;--paper:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--gold);color:#3b0f26;font-weight:700}
button.sec{background:#ffffff22;color:#fff}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid #ffffff44;background:#00000033;color:#fff;width:100%}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.center{text-align:center}
.card-box{background:#00000030;border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.hint{opacity:.8;font-size:15px}
/* toast */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff;color:#7a1020;padding:12px 16px;border-radius:14px;font-weight:600;max-width:92vw;z-index:80;box-shadow:0 6px 24px #0008;display:none}
/* splash */
#splash{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#8a2a55,#3b0f26 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#splash h1{font-size:44px;color:var(--gold);line-height:1.1}
#splash p{font-size:21px;max-width:420px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
/* cartas */
.card{width:46px;height:68px;background:var(--paper);color:var(--ink);border-radius:8px;border:1px solid #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;position:relative;flex:none;user-select:none;box-shadow:0 2px 4px #0005}
.card b{font-size:22px;line-height:1}
.card i{font-style:normal;font-size:22px;line-height:1}
.card.red{color:var(--red)}
.card.jk{color:#6a2ca0}.card.jk i{font-size:9px;letter-spacing:.5px}
.card.sel{transform:translateY(-14px);outline:3px solid var(--gold)}
.card.w{box-shadow:0 0 0 3px #ff8a00 inset,0 2px 4px #0005}
.card.back{background:repeating-linear-gradient(45deg,var(--back1) 0 6px,var(--back2) 6px 12px);border:2px solid #fff}
.card.mini{width:30px;height:44px;border-radius:5px}
.card.mini b{font-size:15px}.card.mini i{font-size:14px}
.card.mini.jk i{display:none}
.card.empty{background:#ffffff14;border:2px dashed #fff5;box-shadow:none}
/* mesa */
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:15px;flex-wrap:wrap}.top .score{white-space:nowrap}
.score{background:#00000040;border-radius:12px;padding:6px 10px}
.opps{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.opp{flex:1;min-width:96px;background:#00000040;border-radius:12px;padding:8px 10px;font-size:15px}
.opp.turn{outline:3px solid var(--gold)}
.table{background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border-radius:20px;padding:12px;border:4px solid #7a4a1d}
.piles{display:flex;gap:22px;justify-content:center;margin:6px 0 10px}
.pile{text-align:center;font-size:14px}
.pile .card{margin:0 auto 4px}
.pile.act .card{outline:3px solid var(--gold);cursor:pointer}
.melds h3{margin:8px 0 4px;font-size:14px;opacity:.85;font-weight:600}
.meld{display:flex;margin:5px 0;padding:6px 8px 6px 4px;border-radius:10px;background:#00000026;overflow-x:auto;align-items:center;gap:8px}
.meld .cards{display:flex}
.meld .cards .card+.card{margin-left:-14px}
.meld.mine.tap{outline:2px dashed var(--gold);cursor:pointer}
.tag{font-size:11px;font-weight:800;background:var(--gold);color:#3b0f26;border-radius:8px;padding:2px 6px;white-space:nowrap}
.status{margin:10px 0;padding:10px 12px;border-radius:12px;background:#00000040;font-weight:600}
.status.me{background:var(--gold);color:#3b0f26}
.bns{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.bns .banner{margin:0;min-height:0;font-size:16px;padding:6px 12px}
.banner{display:flex;align-items:center;gap:10px;background:#f2c14e;color:#3b0f26;border-radius:14px;padding:8px 12px;margin:6px 0;font-weight:700;font-size:17px;min-height:46px;overflow-wrap:anywhere}
.log{background:#00000040;border-radius:12px;padding:6px 10px;margin:4px 0}.log .lh{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9}.log .lh button{padding:3px 10px;font-size:12px}.log .ll{font-size:14px;padding:2px 0;opacity:.75;overflow-wrap:anywhere}.log .ll.new{opacity:1;font-weight:700}
.last{font-size:14px;opacity:.8;margin-bottom:6px}
.dock{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18px);padding:6px 0 4px;margin-top:6px}
.dock .status{margin-top:0}
.need{margin:8px 0;padding:6px 10px;border-radius:10px;background:#00000040;font-size:15px;font-weight:600}.need.ok{background:#0f5a4388}
.pile{position:relative}.lockic{position:absolute;right:-6px;top:-8px;font-size:20px;line-height:1;filter:drop-shadow(0 1px 2px #000a);pointer-events:none}
.lockmsg{text-align:center;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:6px}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.gp{font-size:14px;padding:4px 9px;border-radius:99px;background:#ffffff22;cursor:default}.gp[data-g]{cursor:pointer}.gp.ok{background:#0f5a43}.gp.bad{background:#7a1020}.gp.tot{background:var(--gold);color:#3b0f26;font-weight:800}
.card.stg0{outline:3px solid #4cc9f0}.card.stg1{outline:3px solid #80ed99}.card.stg2{outline:3px solid #ff5d8f}.card.stg3{outline:3px solid #f2c14e}
.meld .rk{font-family:Georgia,serif;font-size:20px;min-width:26px;text-align:center;color:var(--gold)}
.tw{position:relative;height:clamp(520px,78vh,800px);margin:8px 0 26px;padding-bottom:0}
#app.wide{max-width:1000px}
.felt{position:absolute;inset:30px 4px 26px;border-radius:50%/36%;background:radial-gradient(ellipse at 50% 45%,var(--felt),var(--felt2));border:6px solid var(--rim);box-shadow:inset 0 0 40px #0008,0 6px 20px #0006}
.centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.felt .lockmsg{position:absolute;left:50%;top:calc(50% + 74px);transform:translateX(-50%);white-space:nowrap;z-index:3}
.sz{position:absolute;transform:translate(-50%,-50%);display:flex;justify-content:center;z-index:2}
.sz .zg{max-height:100%;overflow:auto}
.zg.col{flex-direction:column;flex-wrap:nowrap;align-items:stretch;max-height:260px;overflow-y:auto}
.sz.mine .zg{background:#0f5a4366;border:1px solid #80ed9966}
.sz.opp .zg{background:#00000045;border:1px solid #ffffff2a}
.zone{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;width:100%;max-height:36%;overflow-y:auto}
.zone.opp .meld{opacity:.92}
.zg{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;background:#0000001f;border-radius:10px;padding:3px 6px}.zl{width:100%;text-align:center;font-size:10px;opacity:.75;line-height:1}
.zsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin:4px 0}.zsel button{padding:5px 12px;font-size:13px;background:#ffffff22;color:#fff;border-radius:99px}.zsel button.on{background:var(--gold);color:#3b0f26}
.centro{display:flex;gap:20px;justify-content:center;align-items:flex-start}
.seat{position:absolute;transform:translate(-50%,-50%);background:#2a0c1c;border:2px solid #ffffff44;border-radius:12px;padding:3px 9px;font-size:13px;text-align:center;line-height:1.25;min-width:78px;z-index:3;white-space:nowrap}
.tw{--seatpad:0}
.seat.mine{border-color:#80ed99}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 3px #f2c14e66}
.reds{position:absolute;left:0;top:-4px;display:flex;gap:8px;font-size:10px;text-align:center;z-index:2}.rd .rdc{display:flex;justify-content:center;min-height:36px;align-items:center}.rd .rdc .card+.card{margin-left:-14px}
.mortos{position:absolute;right:0;top:-4px;display:flex;gap:8px;font-size:10px;text-align:center;z-index:2}
.mt.gone{opacity:.45}.mt .card{margin:0 auto 2px}
.meld{padding:3px 6px 3px 4px;margin:0;gap:5px;flex:none}
.meld .card.mini{width:24px;height:36px}.meld .card.mini b{font-size:13px}.meld .card.mini i{font-size:12px}
.meld .cards .card+.card{margin-left:-14px}
.meld .tag{font-size:9px;padding:1px 4px}
.meld .rk{font-size:14px;min-width:16px}
.sc{overflow-x:auto;margin:6px 0;background:#00000040;border-radius:12px;padding:4px 6px}
.sc table{font-size:13px;line-height:1.2;min-width:100%}.sc th{font-weight:600;opacity:.75;font-size:11px;text-align:center;white-space:nowrap}.sc td{text-align:center;padding:3px 4px;white-space:nowrap}.sc td:first-child,.sc th:first-child{text-align:left}.sc small{opacity:.75}.sc tr.me td{background:#ffffff12}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;background:#ffffff22;flex:none;border:2px solid #ffffff55;overflow:hidden;line-height:1}
.seat .av{margin:0 auto 2px;display:flex}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.avs button{padding:4px 8px;font-size:24px;background:#ffffff1a;border-radius:12px;line-height:1.1}.avs button.on{outline:3px solid var(--gold)}
.avs.t button{font-size:15px;padding:8px 12px;font-weight:600;color:#fff}
.cd{float:right;font-variant-numeric:tabular-nums}.cd.low{color:#b00020;font-weight:800}.status:not(.me) .cd.low{color:#ff8a8a}
.me-av{display:flex;gap:12px;align-items:center}
.chatbtn,.themebtn,.frbtn{padding:6px 12px!important;position:relative}
.frbtn .on{font-size:13px}
.bdg{position:absolute;top:-6px;right:-6px;background:#e63946;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;display:none}
#chatd{position:fixed;left:0;right:0;bottom:0;z-index:35;max-width:760px;margin:0 auto;height:62vh;background:#2a0c1c;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #000a;display:none;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#chatd.open{display:flex}
#chatd .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#chatd .note{font-size:13px;opacity:.75;margin:2px 0 8px}
#chatl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.msg{display:flex;gap:8px;align-items:flex-start}.msg .bub{background:#ffffff18;border-radius:14px;padding:6px 12px;max-width:80%;overflow-wrap:anywhere}.msg.me{flex-direction:row-reverse}.msg.me .bub{background:#0f5a43}.msg .bub b{font-size:12px;opacity:.8;display:block}
.quick{display:flex;gap:6px;margin:6px 0}.quick button{flex:1;font-size:22px;padding:4px;background:#ffffff1a}
#chatf{display:flex;gap:8px}#chatf input{flex:1}
#pv{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#2a0c1c;border-radius:99px;padding:8px 16px;font-weight:600;z-index:36;display:none;max-width:90vw;box-shadow:0 6px 20px #0008}
.thm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:12px 0}.thm button{padding:8px;background:#ffffff14;color:#fff;font-weight:600;font-size:14px;border-radius:14px}.thm i{display:block;height:34px;border-radius:50%/50%;margin-bottom:6px;border:3px solid}
.hand .card{touch-action:none;cursor:grab}
.hand{display:flex;flex-wrap:wrap;gap:4px;padding-top:16px;min-height:96px}
.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.bar button{flex:1;min-width:72px;padding:10px 6px;font-size:15px}
/* modal */
.modal{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:#4a1530;border-radius:20px;padding:18px;max-width:560px;max-height:90vh;overflow:auto;width:100%}
.modal li{margin:6px 0}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
.code{font:800 44px Georgia,serif;letter-spacing:8px;color:var(--gold)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff22}

/* ---- jogo numa tela só: sem rolagem, cartas proporcionais à largura ---- */
#app.wide{height:100vh;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));--cw:min(44px,calc((100vw - 20px)/10 - 3px))}
#app.wide .top{flex:none;font-size:12px;gap:6px;flex-wrap:nowrap}
#app.wide .top .score{padding:3px 8px;font-size:12px;white-space:nowrap}
#app.wide .top button{padding:4px 8px!important;font-size:14px}
#app.wide .need{flex:none;margin:3px 0;padding:2px 8px;font-size:12px}
#app.wide .sc{flex:none;margin:2px 0;padding:2px 4px}
#app.wide .sc table{font-size:10px}#app.wide .sc th{font-size:9px}#app.wide .sc td{padding:1px 3px}#app.wide .sc small{font-size:9px}
#app.wide .tw{flex:1 1 auto;min-height:0;height:auto;margin:4px 0 2px}
#app.wide .felt{inset:24px 2px 22px}
#app.wide .log{display:none}
#app.wide .dock{position:static;background:none;padding:2px 0 0;margin:0;flex:none}
#app.wide .status{margin:2px 0;padding:4px 10px;font-size:13px}
#app.wide .stg{margin-bottom:2px}
#app.wide .stg .gp{font-size:11px;padding:2px 7px}
#app.wide .bar{margin:3px 0;gap:4px;flex-wrap:nowrap}
#app.wide .bar button{min-width:0;padding:7px 3px;font-size:12px;line-height:1.1;border-radius:10px;flex:1}
#app.wide .hand{padding-top:10px;min-height:0;gap:3px}
#app.wide .hand .card{width:var(--cw);height:calc(var(--cw) * 1.45)}
#app.wide .hand .card b,#app.wide .hand .card i{font-size:calc(var(--cw) * .48)}
#app.wide .hand .card.jk i{font-size:6px}
#app.wide .hand .card.jk b{font-size:calc(var(--cw) * .4)}
#app.wide .hand .card.sel{transform:translateY(-8px)}
#app.wide .seat{min-width:54px;padding:2px 6px;font-size:11px;border-width:1px}
#app.wide .seat .av{width:22px!important;height:22px!important;font-size:14px!important;margin-bottom:1px}
#app.wide .pile{font-size:11px}
#app.wide .pile .card{width:34px;height:50px}
#app.wide .pile .card b,#app.wide .pile .card i{font-size:16px}
#app.wide .centro{gap:12px}
#app.wide .card.mini{width:20px;height:30px;border-radius:4px}
#app.wide .card.mini b,#app.wide .card.mini i{font-size:11px}
#app.wide .meld{padding:2px 4px 2px 3px;gap:3px}
#app.wide .meld .cards .card+.card{margin-left:-12px}
#app.wide .meld .rk{font-size:12px;min-width:12px}
#app.wide .meld .tag{font-size:8px;padding:1px 3px}
#app.wide .zl{font-size:9px}
#app.wide .reds,#app.wide .mortos{font-size:8px;top:-2px}
#app.wide .rd .rdc{min-height:30px}
#app.wide .bns{position:absolute;left:6px;right:6px;top:30px;z-index:6;pointer-events:none;margin:0;gap:2px}
#app.wide .bns .banner{font-size:12px;padding:3px 8px;border-radius:10px;gap:6px;opacity:.96}
#app.wide .bns .banner .av{width:20px!important;height:20px!important;font-size:12px!important}
#app.wide .lockmsg{font-size:11px}
#app.wide .sz .zg{padding:2px 4px}
#app.wide .sc table{table-layout:fixed;width:100%}
#app.wide .sc th,#app.wide .sc td{white-space:normal;overflow-wrap:anywhere}
@media(max-width:600px){#app.wide .sc .rk2{display:none}#app.wide .sc th:first-child,#app.wide .sc td:first-child{width:28px}#app.wide .sc table{font-size:9px}#app.wide .sc th{font-size:8px}}
.sc .s{display:none}
@media(max-width:600px){#app.wide .sc .l{display:none}#app.wide .sc .s{display:inline}}
.warn{background:#7a1020;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px}.steps li{margin:4px 0}
#app.wide .sz.mine .zg{max-height:calc(100% - 20px);overflow-y:auto}
#app.wide .bns{position:static;pointer-events:auto;height:38px;margin:2px 0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;cursor:pointer}
#app.wide .bns .banner{font-size:12px;padding:2px 8px;min-height:0;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;flex:none;border-radius:8px}
#app.wide .bns .banner .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#app.wide .bns .banner .av{width:15px!important;height:15px!important;font-size:10px!important;border-width:1px}
#app.wide .sz.mine{max-height:42%;width:max-content}
#app.wide .sz.mine .zg{max-height:100%;overflow-y:auto;justify-content:center}
#app.wide .sz.opp{max-height:68%}
#app.wide .zg.col{max-height:100%}
@media(max-width:600px){#app.wide .centro{top:32%}#app.wide .felt .lockmsg{top:calc(32% + 40px)}#app.wide .sz.mine{max-height:36%}#app.wide .sz.mine .zl{display:none}#app.wide .sz.mine .zg{gap:3px;padding:2px 3px}}
.rd3{display:flex;align-items:center;gap:4px;padding:2px 5px;border-radius:8px;background:#c6283940;border:1px solid #c6283988;flex:none}.rd3 .card+.card{margin-left:-12px}.rd3 .tag{background:#c62839;color:#fff;font-size:9px;padding:1px 4px;border-radius:6px;white-space:nowrap}
.card.newh{box-shadow:0 0 0 3px #f2c14e,0 0 16px #f2c14eaa}
.card.newc{animation:flipin .65s ease-out}
@keyframes flipin{0%{transform:rotateY(90deg) translateY(-50px) scale(.4);opacity:0}55%{transform:rotateY(0) translateY(-18px) scale(1.18);opacity:1}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.card.newc{animation:none}}
.tn{display:inline-block;font-weight:800;padding:1px 9px;border-radius:99px;font-size:14px;line-height:1.35}
.tn.n{background:#1f8f5f;color:#fff}.tn.e{background:#f2c14e;color:#3b0f26}
.pt{font-size:17px;font-variant-numeric:tabular-nums}.vs{opacity:.7;margin:0 2px}
.sc .tn{font-size:12px;padding:1px 7px}
#app.wide .top .score{font-size:13px}
@media(max-width:600px){#app.wide .sc th:first-child,#app.wide .sc td:first-child{width:46px}#app.wide .sc td{font-size:10px}#app.wide .sc .tn{font-size:11px;padding:1px 6px}}

/* conversa como painel lateral transparente, com aba na borda */
#chatd{display:flex;position:fixed;left:auto;right:0;top:142px;bottom:150px;width:min(78vw,320px);max-width:none;height:auto;margin:0;border-radius:16px 0 0 16px;background:rgba(42,12,28,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:-6px 0 22px #0006;padding:8px 10px;transform:translateX(105%);transition:transform .25s ease;pointer-events:none;z-index:35}
#chatd.open{transform:none;pointer-events:auto}
#chatd .hd h2{font-size:15px}#chatd .hd button{padding:3px 10px;font-size:12px}
#chatd .note{font-size:11px;margin:0 0 4px}
#chatd .msg .bub{font-size:13px;padding:4px 9px;background:#ffffff26}#chatd .msg.me .bub{background:#0f5a43cc}
#chatd .quick button{font-size:17px;padding:2px}
#chatd #chatf input{padding:7px 10px;font-size:14px;min-width:0}#chatd #chatf button{padding:7px 12px}

<div id="splash">
  <div style="font-size:64px">🎂</div>
  <h1>Parabéns,<br>Tânia!</h1>
  <p>63 anos de esperteza.<br>Hoje a mesa é sua: chame a turma e bom jogo!</p>
  <p class="hint">Com amor, Caetano</p>
  <button id="enter" style="font-size:22px;padding:16px 34px;margin-top:10px">Entrar na festa</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="engine.js?v=20261020e"></script>
<script src="fx.js?v=20261020e"></script>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const S = window.Samba;
const NS = new URLSearchParams(location.search).get('ns') || '';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} },
};
const PREFIX = 'samba-tania-';
let pid = new URLSearchParams(location.search).get('pid') || ls.get('pid', null); if (!pid) { pid = Math.random().toString(36).slice(2, 10); ls.set('pid', pid); }
let myName = ls.get('name', '');

/* ---------- aviso e confete ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3800);
}
function confetti(ms) {
  const cv = $('#confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cf = window.Eco ? Eco.equipped().confete : null;
  const cols = cf === 'c_coracoes' ? ['#e63946', '#ff5d8f', '#ffb3c1', '#fff'] : cf === 'c_estrelas' ? ['#f2c14e', '#fff3c4', '#4cc9f0', '#fff'] : cf === 'c_dourado' ? ['#f2c14e', '#d4af37', '#9c7d1e', '#fff3c4'] : ['#f2c14e', '#ff5d8f', '#4cc9f0', '#80ed99', '#fff'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height, v: 2 + Math.random() * 4, s: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6 }));
  const end = Date.now() + (ms || 4500);
  (function f() {
    cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.y += p.v; p.r += .1; p.x += Math.sin(p.r); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s * .6); });
    if (Date.now() < end) requestAnimationFrame(f); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}
$('#enter').onclick = () => { $('#splash').style.display = 'none'; };
confetti(5000);

/* ---------- avatar, tema da mesa e conversa ---------- */
const EMOJIS = ['😀', '😎', '🥰', '🤠', '👵', '👴', '👩', '👨', '🧓', '🐱', '🦊', '🐼', '🦁', '🐸', '🌻', '🍀', '⭐', '❤️', '🎩', '👑'];
const BOT_AV = ['👩‍🍳', '🧔', '🎨', '🧑‍🔧', '🦷'];
let myAvatar = ls.get('avatar', '🙂');
let avatars = [];
function safeAv(a) {
  if (typeof a === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]{20,30000}$/.test(a)) return a;
  return typeof a === 'string' && a.length <= 8 && !/[<>&"]/.test(a) ? a : '🙂';
}
function avHtml(a, size) {
  a = safeAv(a);
  return a.startsWith('data:') ? `<img class="av" src="${a}" alt="" style="width:${size}px;height:${size}px">`
    : `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .62)}px">${a}</span>`;
}
// Moldura e título comprados na Loja: viajam no 'hello' e aparecem para todos na mesa (só ids conhecidos passam).
const enfeiteOk = (id, pre) => (typeof id === 'string' && id.length < 24 && id.startsWith(pre) && /^[a-z_]+$/.test(id) ? id : null);
const meuEnfeite = (slot) => (window.Eco ? enfeiteOk(window.Eco.equipped()[slot], slot === 'moldura' ? 'f_' : 't_') : null);
function avMold(a, size, mold) { const h = avHtml(a, size); return mold ? h.replace('class="av"', 'class="av mold-' + mold.slice(2) + '"') : h; }
const tituloTxt = (id) => ({ t_rainha: 'Rainha do Lixo', t_mao: 'Mão de Canastra', t_tranca: 'Trancadora', t_dona_mesa: 'Dona da Mesa', t_dona: 'Dona da Casa' }[id] || '');
function photoToAvatar(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      const x = c.getContext('2d'); const sz = Math.min(img.width, img.height);
      x.drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, 96, 96);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => toast('Não consegui abrir essa foto.');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

const THEMES = [
  { n: 'Verde clássico', felt: '#0f5a43', felt2: '#0b4633', rim: '#7a4a1d', bg: '#3b0f26', b1: '#8a2a55', b2: '#6c1d41' },
  { n: 'Azul noite', felt: '#1d4f91', felt2: '#133663', rim: '#8a8f99', bg: '#0c1a33', b1: '#d4a017', b2: '#a67c00' },
  { n: 'Vinho', felt: '#7a1f3d', felt2: '#561429', rim: '#b8860b', bg: '#240812', b1: '#1f6f5c', b2: '#14493c' },
  { n: 'Roxo festa', felt: '#5b2a86', felt2: '#3f1b63', rim: '#e0b04f', bg: '#1e0c33', b1: '#ff5d8f', b2: '#c93a6b' },
  { n: 'Rosa', felt: '#c2447a', felt2: '#8f2f5a', rim: '#f4d58d', bg: '#3a1027', b1: '#4cc9f0', b2: '#2a8fb0' },
  { n: 'Preto e ouro', felt: '#1c1c1c', felt2: '#0d0d0d', rim: '#d4af37', bg: '#050505', b1: '#d4af37', b2: '#9c7d1e' },
  { n: 'Carnaval', felt: '#e6a800', felt2: '#1f9d55', rim: '#d62828', bg: '#12203a', b1: '#d62828', b2: '#1f9d55' },
  { n: 'Praia', felt: '#2aa5b8', felt2: '#e8c872', rim: '#f4a261', bg: '#0d3b4a', b1: '#f4a261', b2: '#e76f51' },
  { n: 'Céu', felt: '#4aa3df', felt2: '#8fd3f4', rim: '#ffffff', bg: '#14304a', b1: '#ffffff', b2: '#bfe3f7' },
  { n: 'Floresta', felt: '#2d6a4f', felt2: '#1b4332', rim: '#8b5a2b', bg: '#0b1f17', b1: '#d4a373', b2: '#a47148' },
];
function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--felt', t.felt); r.setProperty('--felt2', t.felt2); r.setProperty('--rim', t.rim);
  r.setProperty('--bg', t.bg); r.setProperty('--back1', t.b1); r.setProperty('--back2', t.b2);
  ls.set('theme', t);
}
function randomTheme() {
  const h = (Math.random() * 360) | 0, h2 = (h + 150 + Math.random() * 60) % 360;
  return { n: 'Surpresa', felt: `hsl(${h},55%,30%)`, felt2: `hsl(${h},55%,20%)`, rim: `hsl(${(h + 30) % 360},50%,45%)`, bg: `hsl(${h},45%,11%)`, b1: `hsl(${h2},55%,45%)`, b2: `hsl(${h2},55%,32%)` };
}
applyTheme(ls.get('theme', THEMES[0]));
function themeModal() {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div><h2>Cor da mesa</h2><p class="hint">A escolha vale só para a sua tela. Cada um pode ter a sua.</p><div class="thm">${THEMES.map((t, i) => `<button data-i="${i}"><i style="background:radial-gradient(${t.felt},${t.felt2});border-color:${t.rim}"></i>${t.n}</button>`).join('')}<button data-i="r"><i style="background:conic-gradient(#f66,#fc6,#6f9,#6cf,#c6f,#f66);border-color:#fff"></i>🎲 Surpresa</button></div><button style="width:100%" id="thx">Pronto</button></div>`;
  m.querySelectorAll('.thm button').forEach((b) => (b.onclick = () => applyTheme(b.dataset.i === 'r' ? randomTheme() : THEMES[+b.dataset.i])));
  m.querySelector('#thx').onclick = () => m.remove();
  document.body.appendChild(m);
}

// Conversa aberta da mesa (fora do #app, para o campo de texto não perder o que se digita).
let chatLog = []; let unread = 0; let chatOpen = false;
const chatd = document.createElement('div'); chatd.id = 'chatd';
chatd.innerHTML = `<div class="hd"><h2 style="font-size:20px">Conversa da mesa</h2><button class="sec" id="chx" style="padding:6px 14px">Fechar</button></div>
 <div class="note">Aqui pode conversar à vontade. Combinado: não vale falar das suas cartas 😉</div><div id="chatl"></div>
 <div class="quick">${['👏', '😂', '😮', '🎉', '❤️', '😅'].map((e) => `<button type="button">${e}</button>`).join('')}</div>
 <form id="chatf"><input id="chati" maxlength="200" placeholder="Escreva uma mensagem…" autocomplete="off"><button type="submit">Enviar</button></form>`;
document.body.appendChild(chatd);
const pv = document.createElement('div'); pv.id = 'pv'; document.body.appendChild(pv);
function updateBadges() { document.querySelectorAll('.chatbtn .bdg').forEach((b) => { b.style.display = unread ? 'block' : 'none'; b.textContent = unread; }); }
function renderChat() {
  const l = $('#chatl');
  l.innerHTML = chatLog.map((m) => `<div class="msg ${m.me ? 'me' : ''}">${avHtml(avatars[m.s], 30)}<div class="bub"><b></b><span></span></div></div>`).join('');
  [...l.children].forEach((el, i) => { el.querySelector('.bub b').textContent = chatLog[i].n; el.querySelector('.bub span').textContent = chatLog[i].text; });
  l.scrollTop = l.scrollHeight;
}
function setChat(open) {
  chatOpen = open; chatd.classList.toggle('open', open); document.body.classList.toggle('chat-open', open); ls.set('chatopen', open);
  if (open) { unread = 0; updateBadges(); renderChat(); pv.style.display = 'none'; if (!(window.matchMedia && matchMedia('(pointer:coarse)').matches)) setTimeout(() => $('#chati').focus(), 50); }
}
// aba na borda da tela: abre e fecha a conversa
const chtab = document.createElement('button'); chtab.className = 'chatbtn chtab'; chtab.type = 'button'; chtab.title = 'Conversa';
chtab.innerHTML = '<span class="ic">💬</span><span class="bdg"></span>'; chtab.onclick = () => setChat(!chatOpen); document.body.appendChild(chtab);
$('#chx').onclick = () => setChat(false);
chatd.querySelectorAll('.quick button').forEach((b) => (b.onclick = () => chatSend(b.textContent)));
$('#chatf').onsubmit = (e) => { e.preventDefault(); chatSend($('#chati').value); $('#chati').value = ''; };
function chatSend(text) {
  text = String(text).trim().slice(0, 200); if (!text) return;
  if (Net.host) hostChat(0, text); else if (Net.conn && Net.conn.open) Net.conn.send({ t: 'chat', text }); else toast('Sem conexão.');
}
function onChat(m) {
  m.me = m.s === (Net.view ? Net.view.seat : -1);
  chatLog.push(m); if (chatLog.length > 80) chatLog.shift();
  if (chatOpen) renderChat();
  else if (!m.me) {
    unread++; updateBadges();
    pv.textContent = m.n + ': ' + m.text; pv.style.display = 'block';
    clearTimeout(onChat.t); onChat.t = setTimeout(() => (pv.style.display = 'none'), 3500);
  }
}
function hostChat(seat, text) {
  const p = Net.lobby[seat]; if (!p) return;
  const m = { n: p.name, s: seat, text, ts: Date.now() };
  Net.chat.push(m); if (Net.chat.length > 60) Net.chat.shift();
  Net.lobby.forEach((q, i) => { if (i === 0) onChat({ ...m }); else if (Net.conns[q.pid]) Net.conns[q.pid].send({ t: 'chat', m }); });
}
// Liga os botões de conversa e de cor depois de cada desenho de tela.
function bindChrome() {
  document.querySelectorAll('.chatbtn').forEach((b) => (b.onclick = () => setChat(!chatOpen)));
  document.querySelectorAll('.themebtn').forEach((b) => (b.onclick = themeModal));
  document.querySelectorAll('.mutebtn').forEach((b) => { b.textContent = window.FX && FX.muted ? '🔇' : '🔊'; b.onclick = () => { if (!window.FX) return; FX.toggleMute(); document.querySelectorAll('.mutebtn').forEach((x) => (x.textContent = FX.muted ? '🔇' : '🔊')); }; });
  document.querySelectorAll('.frbtn').forEach((b) => (b.onclick = friendsModal));
  updateBadges();
  if (typeof refreshFriendsUI === 'function') refreshFriendsUI();
}
const friendsBtn = '<button class="sec frbtn">👥 Amigos<span class="on"></span><span class="bdg"></span></button>';
const chromeBtns = '<button class="sec chatbtn" title="Conversa">💬<span class="bdg"></span></button><button class="sec themebtn" title="Cor da mesa">🎨</button><button class="sec mutebtn" title="Som">🔊</button>';

/* ---------- amigos, presença (quem está online) e convites ---------- */
const CODE_AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let myCode = ls.get('ucode', null);
if (!myCode) { myCode = ''; for (let i = 0; i < 6; i++) myCode += CODE_AL[(Math.random() * CODE_AL.length) | 0]; ls.set('ucode', myCode); }
let friends = ls.get('friends', {});   // código -> { name, avatar, st: 'friend' | 'pending' }
let incoming = ls.get('incoming', {}); // pedidos recebidos: código -> { name, avatar }
const presence = {};                    // código -> { online, room, state }
const saveFriends = () => { ls.set('friends', friends); ls.set('incoming', incoming); };
const validCode = (c) => typeof c === 'string' && /^[A-Z2-9]{6}$/.test(c);
let pPeer = null;
const meInfo = () => ({ code: myCode, name: myName || 'Jogador', avatar: myAvatar });
const hostingRoom = () => (Net.host && Net.code && Net.peer && Net.peer.open && !Net.g ? Net.code : null);
const myState = () => (hostingRoom() ? 'sala' : (Net.host && Net.g) || (Net.view && !Net.host && Net.view.phase && Net.view.phase !== 'home') ? 'jogando' : null);

function presenceStart() {
  try { if (pPeer) pPeer.destroy(); } catch (e) {}
  try { pPeer = new Peer('samba-u-' + myCode); } catch (e) { return; }
  pPeer.on('open', () => { pollFriends(); });
  pPeer.on('connection', (c) => c.on('data', (m) => onPresenceMsg(c, m)));
  pPeer.on('disconnected', () => { try { pPeer.reconnect(); } catch (e) {} });
  pPeer.on('error', (e) => { if (e.type === 'unavailable-id') setTimeout(presenceStart, 20000); });
}
function onPresenceMsg(c, m) {
  if (!m || !m.from || !validCode(m.from.code) || m.from.code === myCode) return;
  const code = m.from.code, name = String(m.from.name || 'Amigo').slice(0, 14), avatar = safeAv(m.from.avatar);
  const f = friends[code];
  if (m.t === 'hi') {
    if (f) {
      f.name = name; f.avatar = avatar;
      if (f.st === 'pending' && m.from.want) f.st = 'friend'; // os dois se pediram
    } else if (m.from.want && !incoming[code]) { incoming[code] = { name, avatar }; if (navigator.vibrate) try { navigator.vibrate(150); } catch (e) {} toast(name + ' quer ser seu amigo. Veja em Amigos.'); }
    saveFriends();
    presence[code] = { online: true, room: null, state: null };
    c.send({ t: 'hi2', from: meInfo(), known: !!(friends[code] && friends[code].st === 'friend'), room: hostingRoom(), state: myState() });
    refreshFriendsUI();
  } else if (m.t === 'acc') {

}
function connectTo(code, onOpen, onData, ms) {
  if (!pPeer || !pPeer.open) return false;
  let done = false;
  const c = pPeer.connect('samba-u-' + code, { reliable: true });
  const end = (ok) => { if (done) return; done = true; clearTimeout(t); try { c.close(); } catch (e) {} if (!ok) onData && onData(null); };
  const t = setTimeout(() => end(false), ms || 6000);
  c.on('open', () => onOpen(c, end));
  c.on('data', (m) => { if (done) return; onData && onData(m); end(true); });
  return true;
}
function pingFriend(code) {
  const f = friends[code]; if (!f) return;
  connectTo(code, (c) => c.send({ t: 'hi', from: { ...meInfo(), want: f.st === 'pending' } }), (m) => {
    if (!m) { presence[code] = { online: false }; refreshFriendsUI(); return; }
    if (m.t !== 'hi2' || !m.from) return;
    presence[code] = { online: true, room: /^[A-Z]{4}$/.test(m.room || '') ? m.room : null, state: m.state || null };
    f.name = String(m.from.name || f.name).slice(0, 14); f.avatar = safeAv(m.from.avatar);

}
function pollFriends() { Object.keys(friends).forEach(pingFriend); }
setInterval(() => { if (pPeer && pPeer.open) pollFriends(); }, 25000);

function addFriend(code, name) {

  friends[code] = { name: (inc && inc.name) || name || 'Amigo', avatar: (inc && inc.avatar) || '🙂', st: inc ? 'friend' : 'pending' };

}
function sendAcc(code) { connectTo(code, (c, end) => { c.send({ t: 'acc', from: meInfo() }); setTimeout(() => end(true), 300); }); }

/* ---------- rede: anfitrião (jogador 0) e convidados ---------- */
const Net = { local: false, ctx: { mode: 'livre' }, spec: null, acc: null, opts: { timer: 0, bot: 'normal', msg: 6, lvl: 'dificil', entrada: 50 }, deadline: null, timerId: null, turnTimer: null, viewAt: 0, chat: [], lastAv: null, host: false, code: null, peer: null, conn: null, conns: {}, lobby: [], g: null, botTimer: null, view: null, retry: 0 };

function randCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += a[(Math.random() * a.length) | 0]; return c; }

function persist() {
  if (Net.host && Net.local) { const k = RUNKEY[Net.ctx.mode]; if (k) ls.set(k, { spec: Object.assign({}, Net.spec, { g: null }), g: Net.g, acc: Net.acc, ctx: Net.ctx }); return; }
  if (Net.host) ls.set('host', { code: Net.code, lobby: Net.lobby.map((p) => ({ ...p, connected: false })), g: Net.g, opts: Net.opts, camp: Net.camp || null }); }

function hostStart(code, resume) {
  Net.host = true; Net.local = false; Net.ctx = { mode: 'livre' }; Net.code = code || randCode();
  if (!resume) { Net.lobby = [{ pid, name: myName, bot: false, connected: true, avatar: myAvatar }]; Net.g = null; Net.chat = []; }
  if (resume && Net.lobby[0]) Net.lobby[0].avatar = myAvatar;
  render({ phase: 'conectando' });
  const peer = new Peer(PREFIX + Net.code);
  Net.peer = peer;
  peer.on('open', () => { Net.retry = 0; persist(); broadcast(); });
  peer.on('connection', (conn) => {
    conn.on('data', (m) => hostMsg(conn, m));
    conn.on('close', () => { const p = Net.lobby.find((x) => Net.conns[x.pid] === conn); if (p) { p.connected = false; delete Net.conns[p.pid]; broadcast(); } });
  });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') {
      if (resume && Net.retry++ < 8) { setTimeout(() => hostStart(Net.code, true), 3000); return; }
      if (!resume) { hostStart(null, false); return; }
    }
    toast('Problema de conexão: ' + e.type);
  });
}

function hostMsg(conn, m) {
  if (m.t === 'hello') {
    let p = Net.lobby.find((x) => x.pid === m.pid);
    if (!p) {
      if (Net.g) { conn.send({ t: 'err', msg: 'A partida já começou.' }); return; }
      const bi = Net.lobby.map((x) => x.bot).lastIndexOf(true);
      if (bi < 0 && Net.lobby.length >= 6) { conn.send({ t: 'err', msg: 'A mesa está cheia (6 jogadores).' }); return; }
      p = { pid: m.pid, name: m.name || 'Convidado', bot: false, connected: true, avatar: safeAv(m.avatar) };
      if (bi >= 0) Net.lobby.splice(bi, 1, p); else Net.lobby.push(p); // quem entra assume o lugar de um robô
    }
    p.connected = true; p.name = m.name || p.name; p.avatar = safeAv(m.avatar); p.mold = enfeiteOk(m.mold, "f_"); p.titulo = enfeiteOk(m.titulo, "t_"); p.peerId = typeof m.peerId === 'string' && m.peerId.length < 80 ? m.peerId : null; Net.conns[p.pid] = conn;
    Net.lastAv = null; conn.send({ t: 'chatlog', list: Net.chat });
    persist(); broadcast();
  } else if (m.t === 'chat') {
    const seat = Net.lobby.findIndex((x) => Net.conns[x.pid] === conn);
    if (seat >= 0 && typeof m.text === 'string') hostChat(seat, m.text.trim().slice(0, 200));
  } else if (m.t === 'act') {
    const seat = Net.lobby.findIndex((x) => Net.conns[x.pid] === conn);
    if (seat >= 0) hostAct(seat, m.a);
  }
}

function hostAct(seat, a) {
  if (a.a === 'addBot' && seat === 0 && !Net.g && Net.lobby.length < 6) {
    const names = nomesRobos(); // Loja: Batizar os robôs
    Net.lobby.push({ pid: 'bot' + Date.now(), name: names[Net.lobby.length - 1] || 'Robô', bot: true, connected: true, avatar: BOT_AV[(Net.lobby.length - 1) % BOT_AV.length] });
  } else if (a.a === 'removeBot' && seat === 0 && !Net.g) {
    const i = Net.lobby.map((p) => p.bot).lastIndexOf(true); if (i > 0) Net.lobby.splice(i, 1);
  } else if (a.a === 'swap' && seat === 0 && !Net.g && Net.lobby.length > 1) {
    Net.lobby.splice(1, 0, Net.lobby.pop());
  } else if (a.a === 'start' && seat === 0 && !Net.g) {
    if (Net.lobby.length % 2 || Net.lobby.length < 2) { toast('O jogo é com 2, 4 ou 6 jogadores (pode completar com robô).'); return; }
    const c = Net.opts.camp;
    if (c && c.formato === 'todos' && Net.lobby.length !== 4) { toast('"Cada um com cada um" é com 4 na mesa.'); return; }
    if (c) Net.camp = { id: Date.now().toString(36), nome: c.nome || 'Campeonato da Família', formato: c.formato, jogo: 0, total: c.formato === 'todos' ? 3 : 1, base: Net.lobby.map((p) => p.pid), jogos: [], fim: null };
    else Net.camp = null;
    novoJogo();
  } else if (a.a === 'next' && seat === 0 && Net.g) {
    const r = S.nextRound(Net.g); if (r.error) return toast(r.error); Net.g = r.state;
  } else if (a.a === 'campnext' && seat === 0 && Net.camp && !Net.camp.fim && Net.g && Net.g.phase === 'gameEnd') {
    Net.camp.jogo++; novoJogo();
  } else if (a.a === 'again' && seat === 0 && Net.g && Net.g.phase === 'gameEnd') {
    if (Net.camp) { Net.camp = null; Net.opts.camp = null; } // campeonato encerrado: volta ao jogo livre
    novoJogo();
  } else if (a.a === 'robovez' && Net.g && Net.lateId != null && Net.g.phase === 'playing') {
    clearTimeout(Net.turnTimer); return autoVez(null);
  } else if (a.a === 'nudge' && Net.g && Net.lateId != null) {
    Net.nudge = (Net.nudge || 0) + 1;
  } else if (a.a === 'setopts' && seat === 0) {
    if (a.timer != null && Net.g && Net.g.phase === 'playing') { Net.timerId = null; Net.lateId = null; }
    if ([0, 20, 30, 45, 60, 90, 120].includes(a.timer) && !Net.local) Net.opts.timer = a.timer; // contra robôs não há relógio
    if (['rapido', 'normal', 'lento', 'muito'].includes(a.bot)) Net.opts.bot = a.bot;
    if ([3, 5, 8, 12, 20].includes(a.msg)) Net.opts.msg = a.msg;
    if (['facil', 'normal', 'dificil', 'mestre'].includes(a.lvl) && Net.ctx.mode === 'livre') Net.opts.lvl = a.lvl;
    if (EC && EC.ENTRADAS.includes(a.entrada) && !Net.g) Net.opts.entrada = a.entrada;
    if ([1, 3000, 5000, 10000].includes(a.target) && !Net.g) Net.opts.target = a.target;
    if ([0, 1000, 2000, 3000, 5000].includes(a.vant) && !Net.g) Net.opts.vant = a.vant;
    if (a.camp !== undefined && !Net.g) Net.opts.camp = a.camp && ['todos', 'duplas'].includes(a.camp.formato) ? { formato: a.camp.formato, nome: String(a.camp.nome || '').replace(/[<>&"]/g, '').trim().slice(0, 30) } : null;
  } else if (Net.g && ['draw', 'takePile', 'meld', 'addTo', 'discard'].includes(a.a)) {
    const r = S.act(Net.g, seat, a);
    if (r.error) { if (seat === 0) toast(r.error); else sendTo(seat, { t: 'err', msg: r.error }); return; }
    Net.g = r.state;
  } else return;
  afterMove();
  persist(); broadcast(); armTimer(); scheduleBot();
}

function viewOf(seat) {
  if (!Net.g) return { phase: 'lobby', opts: Net.opts, humanos: Net.lobby.filter((p) => !p.bot).length, code: Net.code, seat, players: Net.lobby.map((p, i) => ({ name: p.name, bot: p.bot, connected: p.connected, mold: i ? p.mold : meuEnfeite("moldura"), titulo: i ? p.titulo : meuEnfeite("titulo") })) };
  const v = S.viewFor(Net.g, seat);
  v.online = Net.lobby.map((p) => p.connected); v.code = Net.code; v.opts = Net.opts;
  v.late = Net.lateId != null && Net.g.phase === 'playing' && Net.lateId === Net.g.round * 100000 + (Net.g.turnNo || 0); v.nudge = Net.nudge || 0;
  v.camp = Net.camp ? { id: Net.camp.id, nome: Net.camp.nome, formato: Net.camp.formato, jogo: Net.camp.jogo, total: Net.camp.total, jogos: Net.camp.jogos, fim: Net.camp.fim } : null;
  v.ctx = Net.ctx; v.local = Net.local; v.molds = Net.lobby.map((p, i) => (i ? p.mold || null : meuEnfeite("moldura")));
  const humanos = Net.lobby.filter((p) => !p.bot).length;
  v.opts = Object.assign({}, Net.opts, { entrada: !Net.local && humanos >= 2 ? Net.opts.entrada : 0 });
  v.peerIds = Net.local ? [] : Net.lobby.map((p, i) => (i === 0 ? (Net.peer && Net.peer.id) || null : p.connected && !p.bot ? p.peerId || null : null));
  v.timeLeft = Net.deadline && Net.g.phase === 'playing' && !Net.g.players[Net.g.turn].bot && Net.opts.timer ? Math.max(0, Math.round((Net.deadline - Date.now()) / 1000)) : null;
  return v;
}
function sendTo(seat, msg) { const p = Net.lobby[seat]; if (p && Net.conns[p.pid]) Net.conns[p.pid].send(msg); }
let lastChange = Date.now();
setInterval(() => {
  if (!Net.host || !Net.g || Net.g.phase !== 'playing') return;
  const g = Net.g;
  if (g.players[g.turn].bot && Date.now() - lastChange > 15000) { lastChange = Date.now(); scheduleBot(); }
}, 5000);
function broadcast() {
  lastChange = Date.now();
  const key = Net.lobby.map((p) => p.pid + (p.avatar ? p.avatar.length : 0)).join('|');
  if (key !== Net.lastAv) {
    Net.lastAv = key; const list = Net.lobby.map((p) => p.avatar || '🙂');
    avatars = list; Net.lobby.forEach((p, i) => { if (i && Net.conns[p.pid]) Net.conns[p.pid].send({ t: 'avs', list }); });
  }
  Net.lobby.forEach((p, i) => {
    if (i === 0) onView(viewOf(0));
    else if (Net.conns[p.pid]) Net.conns[p.pid].send({ t: 'view', v: viewOf(i) });
  });
}
// Relógio da vez dos jogadores humanos: quando acaba, o jogo compra e descarta sozinho.
function armTimer() {
  const g = Net.g;
  // relógio só existe com outra pessoa de verdade na mesa (contra robôs ninguém tem pressa)
  if (!g || g.phase !== 'playing' || !Net.opts.timer || g.players[g.turn].bot || !temOutraPessoa()) { clearTimeout(Net.turnTimer); Net.deadline = null; Net.timerId = null; Net.lateId = null; return; }
  const id = g.round * 100000 + (g.turnNo || 0);
  if (id === Net.timerId && Net.deadline) return;
  clearTimeout(Net.turnTimer); Net.timerId = id; Net.lateId = null; Net.deadline = Date.now() + Net.opts.timer * 1000;
  Net.turnTimer = setTimeout(() => {
    const g2 = Net.g;
    if (!g2 || g2.phase !== 'playing' || g2.round * 100000 + (g2.turnNo || 0) !== id) return;
    // tempo acabou: a mesa avisa todo mundo e, depois de mais 30 s, o jogo compra e descarta pela pessoa (nunca fica parado)
    Net.lateId = id; broadcast();
    Net.turnTimer = setTimeout(() => autoVez(id), LATE_GRACE * 1000);
  }, Net.opts.timer * 1000);

function rulesModal() {

      if (rr && !rr.repeat) out.extra.push(rr.venceu ? (rr.fim ? 'Campeã do Mata-mata!' : 'Vocês passaram para ' + (TO.RODADAS[tm.rodada + 1] || 'a próxima fase').toLowerCase() + '!') : 'Vocês caíram: ' + TO.COLOC[tm.coloc].toLowerCase());

    }
  }

}
// Cada celular paga a própria entrada (mesa valendo moedas) e confere o próprio resultado.

    h += !f.checks[0] && f.checks[1] ? '<p class="hint">Fez o segundo objetivo, mas não o primeiro. A segunda estrela precisa das duas coisas juntas.</p>' : '<p class="hint">As três estrelas: tudo isso numa partida só.</p>';

  if (coins || stars || linhas.length) h += `<div class="eco-res">${coins || stars ? `<b>Você ganhou ${fmt(coins)} moedas${stars ? ' e ' + stars + (stars > 1 ? ' estrelas' : ' estrela') : ''}.</b>` : ''}${linhas.map((l) => `<small>${escH(l)}</small>`).join('')}</div>`;

// Desenha a chave; quando a partida dela já acabou, joga as dos outros uma por vez (fora do fio da tela) e avança.
function chaveModal() {
  const t0 = mmGet(); if (!t0) return goHome();
  document.querySelectorAll('.modal.chave').forEach((x) => x.remove());
  const m = document.createElement('div'); m.className = 'modal chave';
  const nomeD = (t, i) => escH(i === 0 ? 'Você e ' + t.duplas[0].nomes[1] : t.duplas[i].nomes.join(' e '));
  const jogoHtml = (t, j) => {
    const lado = (i, pts) => `<span class="${j.w === i ? 'ven' : j.w != null ? 'per' : ''} ${i === 0 ? 'eu' : ''}">${nomeD(t, i)}${pts != null ? ' <b>' + fmt(pts) + '</b>' : ''}</span>`;
    const pa = j.placar ? (j.w === j.a ? j.placar[0] : j.placar[1]) : null, pb = j.placar ? (j.w === j.b ? j.placar[0] : j.placar[1]) : null;
    return `<div class="jg">${lado(j.a, pa)}<i>×</i>${lado(j.b, pb)}</div>`;
  };
  let simulando = false;
  const paint = () => {
    const t = mmGet(); if (!t) { m.remove(); return; }
    const N = TO.NIVEIS[t.nivel]; const minha = TO.minhaPartida(t); const salva = runSalvo('mm');
    const pend = TO.pendentes(t);
    let acao = '';
    if (t.status === 'andamento' && minha && minha.w == null) {
      const adv = TO.adversario(t, minha);
      acao = salva ? '<button class="bigbtn" id="mmjoga">Continuar a partida</button>' : `<button class="bigbtn" id="mmjoga">Jogar: ${TO.RODADAS[t.rodada]} contra ${escH(adv.nomes.join(' e '))}</button>`;
    } else if (pend || (t.rodada < 2 && TO.rodadaAtual(t).every((j) => j.w != null))) acao = '<p class="hint" style="text-align:center">⏳ Os outros jogos estão acontecendo…</p>';
    const camp = TO.campeao(t);
    let fim = '';
    if (t.status === 'fim') {
      const pg = TO.pagar(EC, t); // uma vez só (livro); repetir só redesenha
      if (pg && !pg.repeat && N.taca && t.coloc === 1) EC.conquistar({ mmOuro: t.nivel === 'ouro' ? 1 : 0 });
      const premio = TO.premio(t);
      fim = `<div class="eco-res" style="text-align:center"><b>${t.coloc === 1 ? '🏆 Campeã do Mata-mata ' + N.nome + '!' : TO.COLOC[t.coloc] + (t.desistiu ? ' (desistiu)' : '')}</b><small>${premio ? 'Prêmio: +' + fmt(premio) + ' moedas' : 'Sem prêmio desta vez'}${t.coloc === 1 ? ' · Moldura Troféu liberada na Loja' + (N.taca ? ' · Taça do Mata-mata' : '') : ''}</small>${camp && !camp.voce && t.jogos[2] && t.jogos[2][0].w != null ? `<small>Campeãs: ${escH(camp.nomes.join(' e '))}</small>` : ''}</div>`;
      if (!pend && !(t.rodada < 2 && TO.rodadaAtual(t).every((j) => j.w != null))) acao = '<button class="bigbtn" id="mmfim">Fechar a chave</button>';
    }
    m.innerHTML = `<div><div style="display:flex;justify-content:space-between;align-items:center"><h2>Mata-mata ${N.nome}</h2><button class="sec" id="mmx">Fechar</button></div>
     ${t.jogos.map((R, r) => `<h3 style="margin:10px 0 4px">${TO.RODADAS[r]}</h3>${R.map((j) => jogoHtml(t, j)).join('')}`).join('')}
     ${fim}${acao}${t.status === 'andamento' && minha && minha.w == null && !salva ? '<button class="sec" id="mmdes" style="width:100%;margin-top:8px">Desistir do torneio</button>' : ''}</div>`;
    m.querySelector('#mmx').onclick = () => { m.remove(); if (Net.view === null) goHome(); };
    const on = (id, fn) => { const el = m.querySelector('#' + id); if (el) el.onclick = fn; };
    on('mmjoga', () => { m.remove(); if (salva) return resumeLocal('mm'); const c = TO.configPartida(t, myName); if (!c) return toast('Não há partida para jogar agora.'); localStart({ mode: 'mm', id: t.id, players: c.players, opts: c.opts, ctx: c.ctx }); });

    on('mmfim', () => { ls.del('mm-torneio'); m.remove(); goHome(); });
  };
  // uma partida dos robôs por vez, com uma pausa para a tela respirar; depois monta a próxima fase da chave
  const simular = () => {
    if (simulando) return; simulando = true;
    const passo = () => {
      const t = mmGet(); if (!t || !m.parentNode) { simulando = false; return; }
      const minha = TO.minhaPartida(t);
      if (minha && minha.w == null) { simulando = false; paint(); return; } // espera a partida dela
      if (TO.simularUma(t, S)) { mmSet(t); paint(); setTimeout(passo, 450); return; }
      if (TO.avancar(t)) { mmSet(t); paint(); setTimeout(passo, 700); return; }
      simulando = false; mmSet(t); paint();
    };
    setTimeout(passo, 300);
  };
  paint(); document.body.appendChild(m); simular();
}

// Roleta grande com suspense (~4 s); o número já foi sorteado e gravado no livro antes de girar.
function roleta(mult, done) {
  const P = EC.CFG.GIRO_PESOS.map((p) => p[0]);
  const el = document.createElement('div'); el.className = 'modal';
  el.innerHTML = '<div class="center"><h2>🎡 Girando…</h2><div id="rol" style="font:800 min(26vw,120px)/1.1 Georgia,serif;color:var(--gold);margin:20px 0">2x</div><p class="hint" id="rolt">O prêmio multiplica a sua entrada</p></div>';
  document.body.appendChild(el);
  const out = el.querySelector('#rol'); let t = 0, k = 0, delay = 60;
  const step = () => {
    t += delay; k++;
    out.textContent = (t > 3600 ? mult : P[k % P.length]) + 'x';
    if (window.FX) FX.sound('tick');
    if (t > 3600) {
      if (window.FX) { FX.sound(mult >= 10 ? 'win' : 'levelup'); FX.buzz([120, 60, 200]); }
      if (mult >= 5) confetti(3000);
      el.querySelector('h2').textContent = 'Prêmio total: ' + fmt(giroE * mult) + ' moedas!'; el.querySelector('#rolt').textContent = 'Dividido pela dupla que vencer. Vença para levar a sua metade: ' + fmt(Math.floor(giroE * mult / 2)) + '.';
      setTimeout(() => { el.remove(); done(); }, 1800); return;
    }
    delay = Math.min(420, delay * 1.12); setTimeout(step, delay);
  };
  step();
}

// Cópia local do histórico (últimas 50), para a lista funcionar sem nuvem.
function localMatches() { const l = ls.get('matches', []); return Array.isArray(l) ? l : []; }
function pushLocalMatch(rec) { const l = localMatches(); l.unshift(Object.assign({ at: Date.now(), id: Date.now().toString(36) }, rec)); ls.set('matches', l.slice(0, 50)); }
// Junta a lista da nuvem com a cópia local (mesmo id = mesma partida), da mais recente para a mais antiga.
function mergeMatches(cloud, local) {
  const seen = new Set(); const out = [];
  (cloud || []).concat(local || []).forEach((r) => { if (!r || seen.has(r.id)) return; seen.add(r.id); out.push(r); });
  return out.sort((a, b) => (b.at || b.clientAt || 0) - (a.at || a.clientAt || 0));
}
// XP somado ao longo do jogo (rodada a rodada); zera quando muda de mesa ou começa um jogo novo.
let xpGame = 0, xpGameKey = '';
if (window.FX) FX.onAward = (v, gain) => {
  const key = v.code || 'solo';
  if (key !== xpGameKey || v.round === 1) { xpGameKey = key; xpGame = 0; }
  xpGame += (gain && gain.gain) || 0;
  if (v.phase === 'gameEnd' && CL) {
    const rec = CL.matchFromView(v, xpGame);
    if (rec) { rec.bots = v.players.filter((p) => p.bot).length; rec.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); pushLocalMatch(rec); CL.saveMatch(rec); }
    xpGame = 0;
  }
  if (cloudOn()) CL.syncProfile(FX.profile()).then((p) => { if (p) FX.setProfile(p); });
};
const fmtN = (n) => (+n || 0).toLocaleString('pt-BR');
const fmtDt = (ms) => { try { return new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };

/* --- Missões: trilha de minijogos que ficam mais difíceis --- */
function missoesFeitas() { return MI && EC ? MI.LISTA.filter((m, i) => EC.has('trilha:' + i)).length : 0; }
const missaoLiberada = (i) => !EC || i === 0 || EC.has('trilha:' + (i - 1));
function telaMissoes() {
  if (!MI) return;
  const feitas = missoesFeitas(); const proxima = MI.LISTA.findIndex((m, i) => !(EC && EC.has('trilha:' + i)));
  const lis = MI.LISTA.map((m, i) => {
    const ok = EC && EC.has('trilha:' + i), lib = missaoLiberada(i);
    return `<button class="mis-i ${ok ? 'ok' : ''} ${i === proxima ? 'agora' : ''}" data-i="${i}" ${lib ? '' : 'disabled'}><span class="mis-n">${ok ? '✅' : lib ? i + 1 : '🔒'}</span><span class="mis-t"><b>${m.nome}</b><small>${lib ? m.obj : 'Termine a missão ' + i + ' para abrir'}</small></span><span class="mis-p">${ok ? '' : '+' + m.premio + ' 🪙'}</span></button>`;
  }).join('');
  abreTela('🎯 Missões', `<p class="hint" style="margin-top:0">Cada missão é uma jogada pronta: você recebe as cartas e tem poucas vezes para cumprir o objetivo. A cada missão fica mais difícil. ${feitas} de ${MI.LISTA.length} feitas.</p><div class="mis-lista">${lis}</div>`, (t) => {
    t.querySelectorAll('.mis-i').forEach((b) => (b.onclick = () => precisaNome(() => missaoIntro(+b.dataset.i))));
  });
}
function missaoIntro(i) {
  const m = MI.LISTA[i]; fechaTela();
  const md = document.createElement('div'); md.className = 'modal';
  md.innerHTML = `<div><h2>Missão ${i + 1}: ${m.nome}</h2><p style="font-size:18px"><b>🎯 ${m.obj}</b></p><p>Você tem <b>${m.turnos} ${m.turnos === 1 ? 'vez' : 'vezes'}</b> (uma vez = comprar, baixar e descartar). Robô: ${NOME_NIVEL[m.bot] || m.bot}.</p><p class="hint">💡 ${m.dica}</p><button class="bigbtn" id="mj">▶ Jogar</button><button class="sec" id="mv" style="width:100%;margin-top:8px">← Voltar às missões</button></div>`;
  document.body.appendChild(md);
  md.querySelector('#mj').onclick = () => { md.remove(); startMissao(i); };
  md.querySelector('#mv').onclick = () => { md.remove(); telaMissoes(); };
}
function startMissao(i) {
  const m = MI.LISTA[i];
  const ps = [{ name: myName, bot: false }, { name: 'Tânia', bot: true, lvl: m.bot }];
  localStart({ mode: 'missao', id: i, players: ps, g: MI.build(S, i, myName), ctx: { lvl: m.bot, mi: i } });
}
// Acompanha o objetivo a cada jogada; quando cumpre ou acaba o limite, mostra o resultado.
function missaoView(v) {
  const i = Net.ctx.mi; if (i == null) return;
  const a = MI.avalia(S, v, i);
  tutHint = '🎯 ' + a.txt;
  if ((a.done || a.fail) && !Net.ctx.misFim) {
    Net.ctx.misFim = true; clearTimeout(Net.botTimer); clearTimeout(Net.turnTimer);
    setTimeout(() => missaoFim(i, a.done), 700);
  }
}
function missaoFim(i, ganhou) {
  const m = MI.LISTA[i]; const md = document.createElement('div'); md.className = 'modal'; md.id = 'misfim';
  let ganho = null; if (ganhou && EC) ganho = EC.grant('trilha:' + i, m.premio, 0, 'Missão ' + (i + 1) + ': ' + m.nome);
  if (ganhou && window.FX) FX.sound('levelup'); if (ganhou) confetti(1800);
  const prox = i + 1 < MI.LISTA.length;
  md.innerHTML = `<div><h2>${ganhou ? '🎉 Missão cumprida!' : '😅 Não deu desta vez'}</h2><p style="font-size:18px"><b>${m.nome}</b></p>${ganhou ? `<p>${ganho ? '+' + m.premio + ' moedas!' : 'Você já tinha ganhado o prêmio desta missão.'}</p>` : `<p>${m.obj}. Tente de novo: as cartas são as mesmas.</p><p class="hint">💡 ${m.dica}</p>`}
   ${ganhou && prox ? '<button class="bigbtn" id="mp">▶ Próxima missão</button>' : ''}<button class="${ganhou && prox ? 'sec' : 'bigbtn'}" id="mr" style="width:100%;margin-top:8px">↻ ${ganhou ? 'Jogar de novo' : 'Tentar de novo'}</button><button class="sec" id="ml" style="width:100%;margin-top:8px">🎯 Todas as missões</button></div>`;
  document.body.appendChild(md);
  const sai = (fn) => () => { md.remove(); fimLocal(); fn(); };
  if (md.querySelector('#mp')) md.querySelector('#mp').onclick = sai(() => missaoIntro(i + 1));
  md.querySelector('#mr').onclick = sai(() => startMissao(i));
  md.querySelector('#ml').onclick = sai(() => telaMissoes());
}

/* --- Domingos: ranking da turma que joga pessoalmente --- */
const DM = window.Domingos || null;
let domTab = 'rank', domAno = String(new Date().getFullYear()), domSort = null, domPres = null, domCasa = null;
const domDados = () => Object.assign({}, DM.PADRAO, ls.get('domingos', {}));
const domSalva = (d) => ls.set('domingos', d);
const domHoje = () => { const x = new Date(); x.setDate(x.getDate() - x.getDay()); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
function telaDomingos() {
  if (!DM) return;
  const d = domDados(); if (!domPres) domPres = d.jogadores.slice(); if (domCasa == null) domCasa = DM.proximaCasa(d.jogos, d.casais.length);
  const anos = [...new Set(d.jogos.map(DM.anoDe).concat([String(new Date().getFullYear())]))].sort();
  const tabs = [['rank', '🏅 Ranking'], ['novo', '➕ Novo jogo'], ['hist', '📜 Jogos'], ['premio', '🎁 Prêmios']];
  const medalha = ['🥇', '🥈', '🥉'];
  let corpo = `<div class="seg" style="margin-bottom:10px">${tabs.map(([k, t]) => `<button type="button" class="${domTab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('')}</div>
   <div class="opt"><div class="seg">${anos.map((a) => `<button type="button" class="${a === domAno ? 'on' : ''}" data-ano="${a}">${a}</button>`).join('')}</div></div>`;
  if (domTab === 'rank') {
    const rk = DM.ranking(d.jogos, domAno);
    corpo += rk.length ? `<div class="mis-lista">${rk.map((x, i) => `<div class="mis-i ${i === 0 ? 'agora' : ''}"><span class="mis-n">${medalha[i] || i + 1 + 'º'}</span><span class="mis-t"><b>${escH(x.nome)}</b><small>${x.jogos} jogos · ${x.v}V ${x.e}E ${x.d}D · ${Math.round(x.aprov * 100)}% · saldo ${x.saldo > 0 ? '+' : ''}${x.saldo}</small></span><span class="mis-p">${x.pts} pts</span></div>`).join('')}</div><p class="hint">Vitória 3 pontos, empate 1, derrota 0.</p><button class="sec" id="dwa" style="width:100%;margin-top:8px">📲 Mandar o ranking no WhatsApp</button>` : '<p class="hint">Ainda não há jogos em ' + domAno + '. Toque em "Novo jogo" no domingo.</p>';
  } else if (domTab === 'novo') {
    corpo += `<div class="card-box"><div class="opt"><b>Data</b><input type="date" id="ddata" value="${domHoje()}" style="width:100%"></div>
     <div class="opt"><b>Quem recebe (coxinha na casa de...)</b><div class="seg">${d.casais.map((c, i) => `<button type="button" class="${domCasa === i ? 'on' : ''}" data-casa="${i}">${escH(c.join(' e '))}</button>`).join('')}<button type="button" class="${domCasa === -1 ? 'on' : ''}" data-casa="-1">Outro lugar</button></div></div>
     <div class="opt"><b>Quem está jogando</b><div class="seg">${d.jogadores.map((n) => `<button type="button" class="${domPres.includes(n) ? 'on' : ''}" data-pres="${escH(n)}">${escH(n)}</button>`).join('')}</div></div>
     <button class="bigbtn" id="dsort">🎲 Sortear os times</button>
     ${domSort ? `<div class="mn-resumo">⚔️ <b>${domSort.A.map(escH).join(' + ')}</b><br>contra<br><b>${domSort.B.map(escH).join(' + ')}</b>${domSort.fora.length ? `<br><small>Fora desta: ${domSort.fora.map(escH).join(', ')}</small>` : ''}</div>
       <div class="opt"><b>Placar final</b><div style="display:flex;gap:10px;align-items:center"><input type="number" id="dpa" inputmode="numeric" placeholder="Time 1" style="flex:1;text-align:center;font-size:22px"><span>×</span><input type="number" id="dpb" inputmode="numeric" placeholder="Time 2" style="flex:1;text-align:center;font-size:22px"></div></div>
       <button class="bigbtn" id="dsalva">✅ Salvar este jogo</button>` : ''}</div>`;
  } else if (domTab === 'hist') {
    const js = d.jogos.filter((j) => DM.anoDe(j) === domAno).slice().sort((a, b) => (b.data + b.id).localeCompare(a.data + a.id));
    corpo += js.length ? js.map((j) => `<div class="card-box"><b>${j.data.slice(8)}/${j.data.slice(5, 7)}</b>${j.casa != null && d.casais[j.casa] ? ' · 🥟 ' + escH(d.casais[j.casa].join(' e ')) : ''}<br>${j.timeA.map(escH).join(' + ')} <b>${j.ptsA}</b> × <b>${j.ptsB}</b> ${j.timeB.map(escH).join(' + ')}<br><button class="sec" data-del="${j.id}" style="padding:6px 12px;margin-top:6px">🗑️ Apagar</button></div>`).join('') : '<p class="hint">Nenhum jogo em ' + domAno + '.</p>';
  } else {
    const ps = DM.premios(d.jogos, domAno, d.casais);
    corpo += `<div class="card-box"><b>🎁 Prêmio do ano (o que está valendo)</b><input id="dprem" value="${escH(d.premio || '')}" placeholder="Ex.: jantar pago pelos outros dois casais" style="width:100%;margin-top:6px"><button class="sec" id="dpsalva" style="margin-top:8px">Guardar</button></div>
     ${ps.length ? ps.map((p) => `<div class="mis-i"><span class="mis-n">${p.ic}</span><span class="mis-t"><b>${p.nome}</b><small>${escH(p.quem)} · ${p.det}</small></span></div>`).join('') : '<p class="hint">Os prêmios aparecem quando houver jogos em ' + domAno + '.</p>'}
     <p class="hint">Vale o ano inteiro: quem estiver na frente em 31/12 leva.</p>`;
  }
  abreTela('🏅 Domingos', corpo, (t) => {
    t.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { domTab = b.dataset.tab; telaDomingos(); }));
    t.querySelectorAll('[data-ano]').forEach((b) => (b.onclick = () => { domAno = b.dataset.ano; telaDomingos(); }));
    t.querySelectorAll('[data-casa]').forEach((b) => (b.onclick = () => { domCasa = +b.dataset.casa; telaDomingos(); }));
    t.querySelectorAll('[data-pres]').forEach((b) => (b.onclick = () => { const n = b.dataset.pres; domPres = domPres.includes(n) ? domPres.filter((x) => x !== n) : domPres.concat([n]); domSort = null; telaDomingos(); }));
    const on = (id, fn) => { const e = t.querySelector('#' + id); if (e) e.onclick = fn; };
    on('dsort', () => { if (domPres.length < 4) return toast('Marque pelo menos 4 pessoas.'); domSort = DM.sorteio(domPres); telaDomingos(); });
    on('dsalva', () => {
      const a = t.querySelector('#dpa').value, b = t.querySelector('#dpb').value; if (a === '' || b === '') return toast('Escreva o placar dos dois times.');
      const dd = domDados(); dd.jogos = dd.jogos.concat([{ id: Date.now().toString(36), data: t.querySelector('#ddata').value || domHoje(), casa: domCasa >= 0 ? domCasa : null, timeA: domSort.A, timeB: domSort.B, ptsA: +a, ptsB: +b }]);
      domSalva(dd); domSort = null; domTab = 'rank'; domAno = dd.jogos[dd.jogos.length - 1].data.slice(0, 4); toast('Jogo anotado!'); telaDomingos();
    });
    t.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => choiceModal('Apagar este jogo do ranking?', [{ label: 'Apagar', fn: () => { const dd = domDados(); dd.jogos = dd.jogos.filter((j) => j.id !== b.dataset.del); domSalva(dd); telaDomingos(); } }])));
    on('dwa', () => window.open('https://wa.me/?text=' + encodeURIComponent(DM.resumoTexto(d.jogos, domAno)), '_blank'));
    on('dpsalva', () => { const dd = domDados(); dd.premio = t.querySelector('#dprem').value.trim().slice(0, 120); domSalva(dd); toast('Prêmio guardado.'); });
  });
}
