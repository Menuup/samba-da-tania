<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3b0f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samba">
<title>Samba da Tânia</title>
<style>
:root{--bg:#3b0f26;--bg2:#5a1a3a;--gold:#f2c14e;--felt:#0f5a43;--felt2:#0b4633;--rim:#7a4a1d;--back1:#8a2a55;--back2:#6c1d41;--ink:#1d1d1d;--red:#c62839;--paper:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--gold);color:#3b0f26;font-weight:700}
button.sec{background:#ffffff22;color:#fff}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid #ffffff44;background:#00000033;color:#fff;width:100%}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.center{text-align:center}
.card-box{background:#00000030;border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.hint{opacity:.8;font-size:15px}
/* toast */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff;color:#7a1020;padding:12px 16px;border-radius:14px;font-weight:600;max-width:92vw;z-index:80;box-shadow:0 6px 24px #0008;display:none}
/* splash */
#splash{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#8a2a55,#3b0f26 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#splash h1{font-size:44px;color:var(--gold);line-height:1.1}
#splash p{font-size:21px;max-width:420px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
/* cartas */
.card{width:46px;height:68px;background:var(--paper);color:var(--ink);border-radius:8px;border:1px solid #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;position:relative;flex:none;user-select:none;box-shadow:0 2px 4px #0005}
.card b{font-size:22px;line-height:1}
.card i{font-style:normal;font-size:22px;line-height:1}
.card.red{color:var(--red)}
.card.jk{color:#6a2ca0}.card.jk i{font-size:9px;letter-spacing:.5px}
.card.sel{transform:translateY(-14px);outline:3px solid var(--gold)}
.card.w{box-shadow:0 0 0 3px #ff8a00 inset,0 2px 4px #0005}
.card.back{background:repeating-linear-gradient(45deg,var(--back1) 0 6px,var(--back2) 6px 12px);border:2px solid #fff}
.card.mini{width:30px;height:44px;border-radius:5px}
.card.mini b{font-size:15px}.card.mini i{font-size:14px}
.card.mini.jk i{display:none}
.card.empty{background:#ffffff14;border:2px dashed #fff5;box-shadow:none}
/* mesa */
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:15px;flex-wrap:wrap}.top .score{white-space:nowrap}
.score{background:#00000040;border-radius:12px;padding:6px 10px}
.opps{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.opp{flex:1;min-width:96px;background:#00000040;border-radius:12px;padding:8px 10px;font-size:15px}
.opp.turn{outline:3px solid var(--gold)}
.table{background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border-radius:20px;padding:12px;border:4px solid #7a4a1d}
.piles{display:flex;gap:22px;justify-content:center;margin:6px 0 10px}
.pile{text-align:center;font-size:14px}
.pile .card{margin:0 auto 4px}
.pile.act .card{outline:3px solid var(--gold);cursor:pointer}
.melds h3{margin:8px 0 4px;font-size:14px;opacity:.85;font-weight:600}
.meld{display:flex;margin:5px 0;padding:6px 8px 6px 4px;border-radius:10px;background:#00000026;overflow-x:auto;align-items:center;gap:8px}
.meld .cards{display:flex}
.meld .cards .card+.card{margin-left:-14px}
.meld.mine.tap{outline:2px dashed var(--gold);cursor:pointer}
.tag{font-size:11px;font-weight:800;background:var(--gold);color:#3b0f26;border-radius:8px;padding:2px 6px;white-space:nowrap}
.status{margin:10px 0;padding:10px 12px;border-radius:12px;background:#00000040;font-weight:600}
.status.me{background:var(--gold);color:#3b0f26}
.bns{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.bns .banner{margin:0;min-height:0;font-size:16px;padding:6px 12px}
.banner{display:flex;align-items:center;gap:10px;background:#f2c14e;color:#3b0f26;border-radius:14px;padding:8px 12px;margin:6px 0;font-weight:700;font-size:17px;min-height:46px;overflow-wrap:anywhere}
.log{background:#00000040;border-radius:12px;padding:6px 10px;margin:4px 0}.log .lh{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9}.log .lh button{padding:3px 10px;font-size:12px}.log .ll{font-size:14px;padding:2px 0;opacity:.75;overflow-wrap:anywhere}.log .ll.new{opacity:1;font-weight:700}
.last{font-size:14px;opacity:.8;margin-bottom:6px}
.dock{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18px);padding:6px 0 4px;margin-top:6px}
.dock .status{margin-top:0}
.need{margin:8px 0;padding:6px 10px;border-radius:10px;background:#00000040;font-size:15px;font-weight:600}.need.ok{background:#0f5a4388}
.lockmsg{text-align:center;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:6px}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.gp{font-size:14px;padding:4px 9px;border-radius:99px;background:#ffffff22;cursor:default}.gp[data-g]{cursor:pointer}.gp.ok{background:#0f5a43}.gp.bad{background:#7a1020}.gp.tot{background:var(--gold);color:#3b0f26;font-weight:800}
.card.stg0{outline:3px solid #4cc9f0}.card.stg1{outline:3px solid #80ed99}.card.stg2{outline:3px solid #ff5d8f}.card.stg3{outline:3px solid #f2c14e}
.meld .rk{font-family:Georgia,serif;font-size:20px;min-width:26px;text-align:center;color:var(--gold)}
.tw{position:relative;height:clamp(520px,78vh,800px);margin:8px 0 26px;padding-bottom:0}
#app.wide{max-width:1000px}
.felt{position:absolute;inset:30px 4px 26px;border-radius:50%/36%;background:radial-gradient(ellipse at 50% 45%,var(--felt),var(--felt2));border:6px solid var(--rim);box-shadow:inset 0 0 40px #0008,0 6px 20px #0006}
.centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.felt .lockmsg{position:absolute;left:50%;top:calc(50% + 74px);transform:translateX(-50%);white-space:nowrap;z-index:3}
.sz{position:absolute;transform:translate(-50%,-50%);display:flex;justify-content:center;z-index:2}
.sz .zg{max-height:100%;overflow:auto}
.zg.col{flex-direction:column;flex-wrap:nowrap;align-items:stretch;max-height:260px;overflow-y:auto}
.sz.mine .zg{background:#0f5a4366;border:1px solid #80ed9966}
.sz.opp .zg{background:#00000045;border:1px solid #ffffff2a}
.zone{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;width:100%;max-height:36%;overflow-y:auto}
.zone.opp .meld{opacity:.92}
.zg{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;background:#0000001f;border-radius:10px;padding:3px 6px}.zl{width:100%;text-align:center;font-size:10px;opacity:.75;line-height:1}
.zsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin:4px 0}.zsel button{padding:5px 12px;font-size:13px;background:#ffffff22;color:#fff;border-radius:99px}.zsel button.on{background:var(--gold);color:#3b0f26}
.centro{display:flex;gap:20px;justify-content:center;align-items:flex-start}
.seat{position:absolute;transform:translate(-50%,-50%);background:#2a0c1c;border:2px solid #ffffff44;border-radius:12px;padding:3px 9px;font-size:13px;text-align:center;line-height:1.25;min-width:78px;z-index:3;white-space:nowrap}
.tw{--seatpad:0}
.seat.mine{border-color:#80ed99}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 3px #f2c14e66}
.reds{position:absolute;left:0;top:-4px;display:flex;gap:8px;font-size:10px;text-align:center;z-index:2}.rd .rdc{display:flex;justify-content:center;min-height:36px;align-items:center}.rd .rdc .card+.card{margin-left:-14px}
.mortos{position:absolute;right:0;top:-4px;display:flex;gap:8px;font-size:10px;text-align:center;z-index:2}
.mt.gone{opacity:.45}.mt .card{margin:0 auto 2px}
.meld{padding:3px 6px 3px 4px;margin:0;gap:5px;flex:none}
.meld .card.mini{width:24px;height:36px}.meld .card.mini b{font-size:13px}.meld .card.mini i{font-size:12px}
.meld .cards .card+.card{margin-left:-14px}
.meld .tag{font-size:9px;padding:1px 4px}
.meld .rk{font-size:14px;min-width:16px}
.sc{overflow-x:auto;margin:6px 0;background:#00000040;border-radius:12px;padding:4px 6px}
.sc table{font-size:13px;line-height:1.2;min-width:100%}.sc th{font-weight:600;opacity:.75;font-size:11px;text-align:center;white-space:nowrap}.sc td{text-align:center;padding:3px 4px;white-space:nowrap}.sc td:first-child,.sc th:first-child{text-align:left}.sc small{opacity:.75}.sc tr.me td{background:#ffffff12}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;background:#ffffff22;flex:none;border:2px solid #ffffff55;overflow:hidden;line-height:1}
.seat .av{margin:0 auto 2px;display:flex}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.avs button{padding:4px 8px;font-size:24px;background:#ffffff1a;border-radius:12px;line-height:1.1}.avs button.on{outline:3px solid var(--gold)}
.avs.t button{font-size:15px;padding:8px 12px;font-weight:600;color:#fff}
.cd{float:right;font-variant-numeric:tabular-nums}.cd.low{color:#b00020;font-weight:800}.status:not(.me) .cd.low{color:#ff8a8a}
.me-av{display:flex;gap:12px;align-items:center}
.chatbtn,.themebtn,.frbtn{padding:6px 12px!important;position:relative}
.frbtn .on{font-size:13px}
.bdg{position:absolute;top:-6px;right:-6px;background:#e63946;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;display:none}
#chatd{position:fixed;left:0;right:0;bottom:0;z-index:35;max-width:760px;margin:0 auto;height:62vh;background:#2a0c1c;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #000a;display:none;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#chatd.open{display:flex}
#chatd .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#chatd .note{font-size:13px;opacity:.75;margin:2px 0 8px}
#chatl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.msg{display:flex;gap:8px;align-items:flex-start}.msg .bub{background:#ffffff18;border-radius:14px;padding:6px 12px;max-width:80%;overflow-wrap:anywhere}.msg.me{flex-direction:row-reverse}.msg.me .bub{background:#0f5a43}.msg .bub b{font-size:12px;opacity:.8;display:block}
.quick{display:flex;gap:6px;margin:6px 0}.quick button{flex:1;font-size:22px;padding:4px;background:#ffffff1a}
#chatf{display:flex;gap:8px}#chatf input{flex:1}
#pv{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#2a0c1c;border-radius:99px;padding:8px 16px;font-weight:600;z-index:36;display:none;max-width:90vw;box-shadow:0 6px 20px #0008}
.thm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:12px 0}.thm button{padding:8px;background:#ffffff14;color:#fff;font-weight:600;font-size:14px;border-radius:14px}.thm i{display:block;height:34px;border-radius:50%/50%;margin-bottom:6px;border:3px solid}
.hand .card{touch-action:none;cursor:grab}
.hand{display:flex;flex-wrap:wrap;gap:4px;padding-top:16px;min-height:96px}
.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.bar button{flex:1;min-width:72px;padding:10px 6px;font-size:15px}
/* modal */
.modal{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:#4a1530;border-radius:20px;padding:18px;max-width:560px;max-height:90vh;overflow:auto;width:100%}
.modal li{margin:6px 0}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
.code{font:800 44px Georgia,serif;letter-spacing:8px;color:var(--gold)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff22}

/* ---- jogo numa tela só: sem rolagem, cartas proporcionais à largura ---- */
#app.wide{height:100vh;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:6px 8px calc(6px + env(safe-area-inset-bottom));--cw:min(44px,calc((100vw - 20px)/10 - 3px))}
#app.wide .top{flex:none;font-size:12px;gap:6px;flex-wrap:nowrap}
#app.wide .top .score{padding:3px 8px;font-size:12px;white-space:nowrap}
#app.wide .top button{padding:4px 8px!important;font-size:14px}
#app.wide .need{flex:none;margin:3px 0;padding:2px 8px;font-size:12px}
#app.wide .sc{flex:none;margin:2px 0;padding:2px 4px}
#app.wide .sc table{font-size:10px}#app.wide .sc th{font-size:9px}#app.wide .sc td{padding:1px 3px}#app.wide .sc small{font-size:9px}
#app.wide .tw{flex:1 1 auto;min-height:0;height:auto;margin:4px 0 2px}
#app.wide .felt{inset:24px 2px 22px}
#app.wide .log{display:none}
#app.wide .dock{position:static;background:none;padding:2px 0 0;margin:0;flex:none}
#app.wide .status{margin:2px 0;padding:4px 10px;font-size:13px}
#app.wide .stg{margin-bottom:2px}
#app.wide .stg .gp{font-size:11px;padding:2px 7px}
#app.wide .bar{margin:3px 0;gap:4px;flex-wrap:nowrap}
#app.wide .bar button{min-width:0;padding:7px 3px;font-size:12px;line-height:1.1;border-radius:10px;flex:1}
#app.wide .hand{padding-top:10px;min-height:0;gap:3px}
#app.wide .hand .card{width:var(--cw);height:calc(var(--cw) * 1.45)}
#app.wide .hand .card b,#app.wide .hand .card i{font-size:calc(var(--cw) * .48)}
#app.wide .hand .card.jk i{font-size:6px}
#app.wide .hand .card.jk b{font-size:calc(var(--cw) * .4)}
#app.wide .hand .card.sel{transform:translateY(-8px)}
#app.wide .seat{min-width:54px;padding:2px 6px;font-size:11px;border-width:1px}
#app.wide .seat .av{width:22px!important;height:22px!important;font-size:14px!important;margin-bottom:1px}
#app.wide .pile{font-size:11px}
#app.wide .pile .card{width:34px;height:50px}
#app.wide .pile .card b,#app.wide .pile .card i{font-size:16px}
#app.wide .centro{gap:12px}
#app.wide .card.mini{width:20px;height:30px;border-radius:4px}
#app.wide .card.mini b,#app.wide .card.mini i{font-size:11px}
#app.wide .meld{padding:2px 4px 2px 3px;gap:3px}
#app.wide .meld .cards .card+.card{margin-left:-12px}
#app.wide .meld .rk{font-size:12px;min-width:12px}
#app.wide .meld .tag{font-size:8px;padding:1px 3px}
#app.wide .zl{font-size:9px}
#app.wide .reds,#app.wide .mortos{font-size:8px;top:-2px}
#app.wide .rd .rdc{min-height:30px}
#app.wide .bns{position:absolute;left:6px;right:6px;top:30px;z-index:6;pointer-events:none;margin:0;gap:2px}
#app.wide .bns .banner{font-size:12px;padding:3px 8px;border-radius:10px;gap:6px;opacity:.96}
#app.wide .bns .banner .av{width:20px!important;height:20px!important;font-size:12px!important}
#app.wide .lockmsg{font-size:11px}
#app.wide .sz .zg{padding:2px 4px}
#app.wide .sc table{table-layout:fixed;width:100%}
#app.wide .sc th,#app.wide .sc td{white-space:normal;overflow-wrap:anywhere}
@media(max-width:600px){#app.wide .sc .rk2{display:none}#app.wide .sc th:first-child,#app.wide .sc td:first-child{width:28px}#app.wide .sc table{font-size:9px}#app.wide .sc th{font-size:8px}}
.sc .s{display:none}
@media(max-width:600px){#app.wide .sc .l{display:none}#app.wide .sc .s{display:inline}}
.warn{background:#7a1020;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px}.steps li{margin:4px 0}
#app.wide .sz.mine .zg{max-height:calc(100% - 20px);overflow-y:auto}
#app.wide .bns{position:static;pointer-events:auto;height:38px;margin:2px 0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;cursor:pointer}
#app.wide .bns .banner{font-size:12px;padding:2px 8px;min-height:0;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;flex:none;border-radius:8px}
#app.wide .bns .banner .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#app.wide .bns .banner .av{width:15px!important;height:15px!important;font-size:10px!important;border-width:1px}
#app.wide .sz.mine{max-height:42%;width:max-content}
#app.wide .sz.mine .zg{max-height:100%;overflow-y:auto;justify-content:center}
#app.wide .sz.opp{max-height:68%}
#app.wide .zg.col{max-height:100%}
@media(max-width:600px){#app.wide .centro{top:32%}#app.wide .felt .lockmsg{top:calc(32% + 40px)}#app.wide .sz.mine{max-height:36%}#app.wide .sz.mine .zl{display:none}#app.wide .sz.mine .zg{gap:3px;padding:2px 3px}}
.rd3{display:flex;align-items:center;gap:4px;padding:2px 5px;border-radius:8px;background:#c6283940;border:1px solid #c6283988;flex:none}.rd3 .card+.card{margin-left:-12px}.rd3 .tag{background:#c62839;color:#fff;font-size:9px;padding:1px 4px;border-radius:6px;white-space:nowrap}
.card.newh{box-shadow:0 0 0 3px #f2c14e,0 0 16px #f2c14eaa}
.card.newc{animation:flipin .65s ease-out}
@keyframes flipin{0%{transform:rotateY(90deg) translateY(-50px) scale(.4);opacity:0}55%{transform:rotateY(0) translateY(-18px) scale(1.18);opacity:1}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.card.newc{animation:none}}
.tn{display:inline-block;font-weight:800;padding:1px 9px;border-radius:99px;font-size:14px;line-height:1.35}
.tn.n{background:#1f8f5f;color:#fff}.tn.e{background:#f2c14e;color:#3b0f26}
.pt{font-size:17px;font-variant-numeric:tabular-nums}.vs{opacity:.7;margin:0 2px}
.sc .tn{font-size:12px;padding:1px 7px}
#app.wide .top .score{font-size:13px}
@media(max-width:600px){#app.wide .sc th:first-child,#app.wide .sc td:first-child{width:46px}#app.wide .sc td{font-size:10px}#app.wide .sc .tn{font-size:11px;padding:1px 6px}}

/* conversa como painel lateral transparente, com aba na borda */
#chatd{display:flex;position:fixed;left:auto;right:0;top:142px;bottom:150px;width:min(78vw,320px);max-width:none;height:auto;margin:0;border-radius:16px 0 0 16px;background:rgba(42,12,28,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:-6px 0 22px #0006;padding:8px 10px;transform:translateX(105%);transition:transform .25s ease;pointer-events:none;z-index:35}
#chatd.open{transform:none;pointer-events:auto}
#chatd .hd h2{font-size:15px}#chatd .hd button{padding:3px 10px;font-size:12px}
#chatd .note{font-size:11px;margin:0 0 4px}
#chatd .msg .bub{font-size:13px;padding:4px 9px;background:#ffffff26}#chatd .msg.me .bub{background:#0f5a43cc}
#chatd .quick button{font-size:17px;padding:2px}
#chatd #chatf input{padding:7px 10px;font-size:14px;min-width:0}#chatd #chatf button{padding:7px 12px}
.chtab{position:fixed;right:0;top:44%;z-index:36;border-radius:12px 0 0 12px!important;padding:12px 7px!important;background:rgba(42,12,28,.78)!important;color:#fff;border:1px solid #ffffff44;border-right:0;transition:right .25s ease;box-shadow:-3px 0 12px #0005}
.chtab .ic{font-size:20px}

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const S = window.Samba;
const NS = new URLSearchParams(location.search).get('ns') || '';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} },
};
const PREFIX = 'samba-tania-';
let pid = new URLSearchParams(location.search).get('pid') || ls.get('pid', null); if (!pid) { pid = Math.random().toString(36).slice(2, 10); ls.set('pid', pid); }
let myName = ls.get('name', '');

/* ---------- aviso e confete ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3800);
}
function confetti(ms) {
  const cv = $('#confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cf = window.Eco ? Eco.equipped().confete : null;
  const cols = cf === 'c_coracoes' ? ['#e63946', '#ff5d8f', '#ffb3c1', '#fff'] : cf === 'c_estrelas' ? ['#f2c14e', '#fff3c4', '#4cc9f0', '#fff'] : cf === 'c_dourado' ? ['#f2c14e', '#d4af37', '#9c7d1e', '#fff3c4'] : ['#f2c14e', '#ff5d8f', '#4cc9f0', '#80ed99', '#fff'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height, v: 2 + Math.random() * 4, s: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6 }));
  const end = Date.now() + (ms || 4500);
  (function f() {
    cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.y += p.v; p.r += .1; p.x += Math.sin(p.r); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s * .6); });
    if (Date.now() < end) requestAnimationFrame(f); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}
$('#enter').onclick = () => { $('#splash').style.display = 'none'; };
confetti(5000);

/* ---------- avatar, tema da mesa e conversa ---------- */
const EMOJIS = ['😀', '😎', '🥰', '🤠', '👵', '👴', '👩', '👨', '🧓', '🐱', '🦊', '🐼', '🦁', '🐸', '🌻', '🍀', '⭐', '❤️', '🎩', '👑'];
const BOT_AV = ['🤖', '👾', '🦉', '🐙', '🦄'];
let myAvatar = ls.get('avatar', '🙂');
let avatars = [];
function safeAv(a) {
  if (typeof a === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]{20,30000}$/.test(a)) return a;
  return typeof a === 'string' && a.length <= 8 && !/[<>&"]/.test(a) ? a : '🙂';
}
function avHtml(a, size) {
  a = safeAv(a);
  return a.startsWith('data:') ? `<img class="av" src="${a}" alt="" style="width:${size}px;height:${size}px">`
    : `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .62)}px">${a}</span>`;
}
function photoToAvatar(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      const x = c.getContext('2d'); const sz = Math.min(img.width, img.height);
      x.drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, 96, 96);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => toast('Não consegui abrir essa foto.');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

const CODE_AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

if (!myCode) { myCode = ''; for (let i = 0; i < 6; i++) myCode += CODE_AL[(Math.random() * CODE_AL.length) | 0]; ls.set('ucode', myCode); }
let friends = ls.get('friends', {});   // código -> { name, avatar, st: 'friend' | 'pending' }
let incoming = ls.get('incoming', {}); // pedidos recebidos: código -> { name, avatar }
const presence = {};                    // código -> { online, room, state }
const saveFriends = () => { ls.set('friends', friends); ls.set('incoming', incoming); };
const validCode = (c) => typeof c === 'string' && /^[A-Z2-9]{6}$/.test(c);
let pPeer = null;
const meInfo = () => ({ code: myCode, name: myName || 'Jogador', avatar: myAvatar });
const hostingRoom = () => (Net.host && Net.code && Net.peer && Net.peer.open && !Net.g ? Net.code : null);
const myState = () => (hostingRoom() ? 'sala' : (Net.host && Net.g) || (Net.view && !Net.host && Net.view.phase && Net.view.phase !== 'home') ? 'jogando' : null);

function presenceStart() {
  try { if (pPeer) pPeer.destroy(); } catch (e) {}
  try { pPeer = new Peer('samba-u-' + myCode); } catch (e) { return; }
  pPeer.on('open', () => { pollFriends(); });
  pPeer.on('connection', (c) => c.on('data', (m) => onPresenceMsg(c, m)));
  pPeer.on('disconnected', () => { try { pPeer.reconnect(); } catch (e) {} });
  pPeer.on('error', (e) => { if (e.type === 'unavailable-id') setTimeout(presenceStart, 20000); });
}
function onPresenceMsg(c, m) {
  if (!m || !m.from || !validCode(m.from.code) || m.from.code === myCode) return;
  const code = m.from.code, name = String(m.from.name || 'Amigo').slice(0, 14), avatar = safeAv(m.from.avatar);
  const f = friends[code];
  if (m.t === 'hi') {
    if (f) {
      f.name = name; f.avatar = avatar;
      if (f.st === 'pending' && m.from.want) f.st = 'friend'; // os dois se pediram
    } else if (m.from.want && !incoming[code]) { incoming[code] = { name, avatar }; if (navigator.vibrate) try { navigator.vibrate(150); } catch (e) {} toast(name + ' quer ser seu amigo. Veja em Amigos.'); }
    saveFriends();
    presence[code] = { online: true, room: null, state: null };
    c.send({ t: 'hi2', from: meInfo(), known: !!(friends[code] && friends[code].st === 'friend'), room: hostingRoom(), state: myState() });
    refreshFriendsUI();
  } else if (m.t === 'acc') {
    if (f && f.st === 'pending') { f.st = 'friend'; f.name = name; f.avatar = avatar; saveFriends(); toast(name + ' aceitou seu pedido!'); refreshFriendsUI(); }
  } else if (m.t === 'invite' && f && f.st === 'friend' && /^[A-Z]{4}$/.test(m.room || '')) {
    inviteModal(f.name, m.room);
  }
}
function connectTo(code, onOpen, onData, ms) {
  if (!pPeer || !pPeer.open) return false;
  let done = false;
  const c = pPeer.connect('samba-u-' + code, { reliable: true });
  const end = (ok) => { if (done) return; done = true; clearTimeout(t); try { c.close(); } catch (e) {} if (!ok) onData && onData(null); };
  const t = setTimeout(() => end(false), ms || 6000);
  c.on('open', () => onOpen(c, end));
  c.on('data', (m) => { if (done) return; onData && onData(m); end(true); });
  return true;
}
function pingFriend(code) {
  const f = friends[code]; if (!f) return;
  connectTo(code, (c) => c.send({ t: 'hi', from: { ...meInfo(), want: f.st === 'pending' } }), (m) => {
    if (!m) { presence[code] = { online: false }; refreshFriendsUI(); return; }
    if (m.t !== 'hi2' || !m.from) return;
    presence[code] = { online: true, room: /^[A-Z]{4}$/.test(m.room || '') ? m.room : null, state: m.state || null };
    f.name = String(m.from.name || f.name).slice(0, 14); f.avatar = safeAv(m.from.avatar);
    if (f.st === 'pending' && m.known) { f.st = 'friend'; toast(f.name + ' agora é seu amigo!'); }
    saveFriends(); refreshFriendsUI();
  });
}
function pollFriends() { Object.keys(friends).forEach(pingFriend); }
setInterval(() => { if (pPeer && pPeer.open) pollFriends(); }, 25000);

function addFriend(code, name) {
  code = String(code || '').trim().toUpperCase();
  if (!validCode(code)) return toast('Esse código não parece certo. São 6 letras e números.');
  if (code === myCode) return toast('Esse é o seu próprio código 🙂');
  if (friends[code]) return toast('Essa pessoa já está na sua lista.');
  const inc = incoming[code];
  friends[code] = { name: (inc && inc.name) || name || 'Amigo', avatar: (inc && inc.avatar) || '🙂', st: inc ? 'friend' : 'pending' };
  if (inc) { delete incoming[code]; sendAcc(code); }
  saveFriends(); pingFriend(code); refreshFriendsUI();
  toast(inc ? 'Vocês agora são amigos!' : 'Pedido enviado. Quando a pessoa abrir o app, ela vai ver.');
}
function sendAcc(code) { connectTo(code, (c, end) => { c.send({ t: 'acc', from: meInfo() }); setTimeout(() => end(true), 300); }); }
function acceptIncoming(code) {
  const inc = incoming[code]; if (!inc) return;
  friends[code] = { name: inc.name, avatar: inc.avatar, st: 'friend' }; delete incoming[code];
  saveFriends(); sendAcc(code); pingFriend(code); refreshFriendsUI();
}
function inviteFriend(code) {
  const room = hostingRoom(); if (!room) return toast('Crie uma mesa primeiro.');
  const ok = connectTo(code, (c, end) => { c.send({ t: 'invite', from: meInfo(), room }); toast('Convite enviado para ' + friends[code].name + '.'); setTimeout(() => end(true), 400); }, null, 5000);
  if (!ok) toast('Sem conexão agora. Tente de novo em instantes.');
}

/* ---------- rede: anfitrião (jogador 0) e convidados ---------- */
const Net = { local: false, ctx: { mode: 'livre' }, spec: null, acc: null, opts: { timer: 60, bot: 'normal', msg: 6, lvl: 'normal', entrada: 50 }, deadline: null, timerId: null, turnTimer: null, viewAt: 0, chat: [], lastAv: null, host: false, code: null, peer: null, conn: null, conns: {}, lobby: [], g: null, botTimer: null, view: null, retry: 0 };

function randCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += a[(Math.random() * a.length) | 0]; return c; }

function persist() {
  if (Net.host && Net.local) { const k = RUNKEY[Net.ctx.mode]; if (k) ls.set(k, { spec: Object.assign({}, Net.spec, { g: null }), g: Net.g, acc: Net.acc, ctx: Net.ctx }); return; }
  if (Net.host) ls.set('host', { code: Net.code, lobby: Net.lobby.map((p) => ({ ...p, connected: false })), g: Net.g, opts: Net.opts }); }

function hostStart(code, resume) {
  Net.host = true; Net.local = false; Net.ctx = { mode: 'livre' }; Net.code = code || randCode();
  if (!resume) { Net.lobby = [{ pid, name: myName, bot: false, connected: true, avatar: myAvatar }]; Net.g = null; Net.chat = []; }
  if (resume && Net.lobby[0]) Net.lobby[0].avatar = myAvatar;
  render({ phase: 'conectando' });
  const peer = new Peer(PREFIX + Net.code);
  Net.peer = peer;
  peer.on('open', () => { Net.retry = 0; persist(); broadcast(); });
  peer.on('connection', (conn) => {
    conn.on('data', (m) => hostMsg(conn, m));
    conn.on('close', () => { const p = Net.lobby.find((x) => Net.conns[x.pid] === conn); if (p) { p.connected = false; delete Net.conns[p.pid]; broadcast(); } });
  });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') {
      if (resume && Net.retry++ < 8) { setTimeout(() => hostStart(Net.code, true), 3000); return; }
      if (!resume) { hostStart(null, false); return; }
    }
    toast('Problema de conexão: ' + e.type);
  });
}

function hostMsg(conn, m) {

function join(code, retry) {
  code = code.trim().toUpperCase();
  if (code.length !== 4) return toast('O código tem 4 letras.');
  Net.host = false; Net.code = code;
  if (!retry) { leaveTable(); render({ phase: 'conectando' }); }
  else if (Net.peer) { Net.peer.sambaGone = true; try { Net.peer.destroy(); } catch (e) {} }
  const peer = new Peer(); Net.peer = peer;
  // Caiu: marca este peer como morto (para o 'close' do destroy não contar de novo) e agenda a volta.
  const lost = () => {
    if (peer.sambaGone) return; peer.sambaGone = true;
    if (Net.host || Net.peer !== peer || Net.code !== code) return;
    try { peer.destroy(); } catch (e) {}
    Net.rejoin = (Net.rejoin || 0) + 1;
    if (Net.rejoin > REJOIN_MAX) { showRejoin(0); rejoinFailModal(code); return; }
    showRejoin(Net.rejoin);
    clearTimeout(Net.rejoinT); Net.rejoinT = setTimeout(() => join(code, true), REJOIN_MS);
  };
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true }); Net.conn = conn;
    conn.on('open', () => { Net.rejoin = 0; showRejoin(0); ls.set('sala', code); conn.send({ t: 'hello', pid, name: myName, avatar: myAvatar, peerId: peer.id }); });
    conn.on('data', (m) => { if (m.t === 'view') onView(m.v); else if (m.t === 'avs' && Array.isArray(m.list)) { avatars = m.list.slice(0, 6).map(safeAv); if (Net.view) render(Net.view); } else if (m.t === 'chat' && m.m) onChat(m.m); else if (m.t === 'chatlog' && Array.isArray(m.list)) { chatLog = []; m.list.forEach((x) => onChat({ ...x })); unread = 0; updateBadges(); } else if (m.t === 'err') { toast(m.msg); if (!Net.view) goHome(); } });
    conn.on('close', lost);
    conn.on('error', lost);
  });
  peer.on('disconnected', () => { if (!peer.sambaGone) try { peer.reconnect(); } catch (e) { lost(); } });
  peer.on('error', (e) => {
    if (e.type === 'peer-unavailable') {
      if (retry) { lost(); return; } // a mesa pode estar voltando também
      toast('Não achei essa mesa. Confira o código e se a Tânia já criou a mesa.'); goHome();
    } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type) && (retry || Net.view)) lost();
    else toast('Problema de conexão: ' + e.type);
  });
}

// Ordem da mão: começa agrupando as cartas iguais; depois a pessoa arrasta como quiser.
// Cartas novas entram ao lado de uma igual (ou no fim, se não houver).
let order = []; let orderRound = -1; let dragEnd = 0;
const SO = { P: 0, O: 1, C: 2, E: 3, J: 4 };
const groupSort = (a, b) => (a.r === 0 ? 99 : a.r === 2 ? 98 : a.r) - (b.r === 0 ? 99 : b.r === 2 ? 98 : b.r) || SO[a.s] - SO[b.s];
function sortedHand(h, round) {
  if (round !== orderRound) { order = []; orderRound = round; }
  const byId = new Map(h.map((c) => [c.id, c]));
  if (!order.length) order = h.slice().sort(groupSort).map((c) => c.id);
  order = order.filter((id) => byId.has(id));
  const have = new Set(order);
  for (const c of h.slice().sort(groupSort)) {
    if (have.has(c.id)) continue;
    let at = -1;
    order.forEach((id, i) => { if (byId.get(id).r === c.r) at = i; });
    if (at >= 0) order.splice(at + 1, 0, c.id); else order.push(c.id);
    have.add(c.id);
  }
  return order.map((id) => byId.get(id));
}

function enableDrag(v) {
  document.querySelectorAll('.hand .card').forEach((el) => {
    el.onpointerdown = (e) => {

        if (!moved && Math.hypot(dx, dy) > 10) { moved = true; el.style.zIndex = 20; el.style.opacity = '.85'; }
        if (moved) el.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`;
      };
      el.onpointerup = (m) => {
        el.onpointermove = el.onpointerup = null;
        if (!moved) return;
        dragEnd = Date.now();
        el.style.visibility = 'hidden';
        const t = document.elementFromPoint(m.clientX, m.clientY);
        el.style.visibility = '';
        const target = t && t.closest ? t.closest('.hand .card') : null;
        if (target && target !== el) {
          const tid = +target.dataset.id; const r = target.getBoundingClientRect();
          order = order.filter((x) => x !== id);
          let i = order.indexOf(tid); if (m.clientX > r.left + r.width / 2) i++;
          order.splice(i, 0, id);
          if (window.Tutorial) Tutorial.onReorder();
        }
        render(v);
      };
    };
  });
}

/* --- partidas locais contra robôs (sem PeerJS) --- */
function themeTemp(t) { const r = document.documentElement.style; r.setProperty('--felt', t.felt); r.setProperty('--felt2', t.felt2); r.setProperty('--rim', t.rim); r.setProperty('--bg', t.bg); }
function localStart(spec, resume) {
  leaveTable(); clearTimeout(Net.botTimer);
  Net.host = true; Net.local = true; Net.peer = null; Net.code = null; Net.conns = {}; Net.chat = []; Net.lateId = null; Net.deadline = null;
  Net.spec = spec; Net.ctx = Object.assign({}, spec.ctx || {}, { mode: spec.mode, id: spec.id || null });
  Net.acc = resume ? resume.acc || { rounds: [] } : { rounds: [] };
  Net.lobby = spec.players.map((p, i) => ({ pid: i ? 'bot' + i : pid, name: i ? p.name : myName || p.name, bot: !!p.bot, lvl: p.lvl, connected: true, avatar: i ? BOT_AV[(i - 1) % BOT_AV.length] : myAvatar }));
  Net.opts = Object.assign({}, Net.opts, { timer: 0 }); // contra robôs não há relógio
  Net.g = resume ? resume.g : spec.g || S.newGame(spec.players.map((p, i) => (i ? p : Object.assign({}, p, { name: myName || p.name }))), spec.opts);
  if (spec.mode === 'fase' && FA) { const f = FA.byId(spec.id); if (f) themeTemp(THEMES[FA.SALAS[f.sala - 1].tema]); }
  if (spec.onStart && !resume) spec.onStart(Net.g);

}

}
// Resultado gravado no motor: logo depois da jogada, antes de guardar e de desenhar.
function afterMove() {
  if (!Net.host || !Net.g) return;
  if (Net.local && Net.ctx.mode === 'treino' && TU) TU.prep(Net.g);
  if (Net.g.phase === 'roundEnd' || Net.g.phase === 'gameEnd') doSettle(viewOf(0), true);
}
function doSettle(v, host) {
  if (!EC || !v || !v.runId) return null;
  const k = v.runId + ':' + v.round; if (settled[k]) return settled[k];
  const ctx = host ? Net.ctx : { mode: 'livre' };
  const humanos = (v.players || []).filter((p, i) => !p.bot && (!v.online || v.online[i])).length;
  const lvl = (host && Net.lobby[1] && Net.lobby[1].lvl) || (v.opts && v.opts.lvl) || 'normal';
  const mode = ctx.mode === 'livre' && humanos >= 2 ? 'familia' : ctx.mode === 'giro' ? 'mm' : ctx.mode;
  const tot = (v.turnos || []).reduce((a, b) => a + b, 0);
  const r = EC.settle(v, { mode, id: ctx.id, lvl, humanos, online: !v.local && humanos >= 2, turnosEsperados: v.n ? tot / v.n : 0 });
  const out = { r, extra: [] };
  const t = v.myTeam;
  if (ctx.mode === 'fase' && FA) { Net.acc = FA.acumular(Net.acc, v); if (v.phase === 'gameEnd') out.fase = FA.registrar(EC, ctx.id, v, Net.acc); }
  if (ctx.mode === 'premio' && v.phase === 'gameEnd' && v.winner === t) { const p = PREMIO[ctx.id]; if (p && EC.grant('premio:' + v.runId, p.premio, 0, 'Mesa com Prêmio ' + p.nome)) out.extra.push('Seu time venceu a Mesa com Prêmio: +' + fmt(p.premio) + ' moedas'); }
  if (ctx.mode === 'desafio' && v.phase === 'gameEnd') {
    const bat = (v.gstats || []).reduce((a, st, i) => a + (v.players[i].team === t ? st.bater || 0 : 0), 0);
    const c = 60 + (v.winner === t ? 50 : 0) + (bat ? 40 : 0);
    if (EC.grant('desafio:' + ctx.id, c, 0, 'Desafio do Dia')) { EC.mark('taca:desafio:' + ctx.id, v.scores[t]); out.extra.push('Desafio do Dia: +' + c + ' moedas e a taça pequena de hoje'); out.desafioPts = v.scores[t]; }
  }
  if (ctx.mode === 'giro' && v.phase === 'gameEnd') { const gr = EC.giroFim(v); if (gr) out.extra.push('Giro da Sorte ' + gr.mult + 'x: prêmio total ' + fmt(gr.total) + ', dividido pela dupla: +' + fmt(gr.premio) + ' moedas'); }
  if (!v.local && v.phase === 'gameEnd' && v.opts && v.opts.entrada) { const m = EC.mesaFim(v, v.opts.entrada); if (m && m.parte) out.extra.push('Prêmio da mesa: +' + fmt(m.parte) + ' moedas'); }
  settled[k] = out; return out;
}

function roleta(mult, done) {
  const P = EC.CFG.GIRO_PESOS.map((p) => p[0]);
  const el = document.createElement('div'); el.className = 'modal';
  el.innerHTML = '<div class="center"><h2>🎡 Girando…</h2><div id="rol" style="font:800 min(26vw,120px)/1.1 Georgia,serif;color:var(--gold);margin:20px 0">2x</div><p class="hint" id="rolt">O prêmio multiplica a sua entrada</p></div>';

  const out = el.querySelector('#rol'); let t = 0, k = 0, delay = 60;
  const step = () => {
    t += delay; k++;
    out.textContent = (t > 3600 ? mult : P[k % P.length]) + 'x';
    if (window.FX) FX.sound('tick');
    if (t > 3600) {
      if (window.FX) { FX.sound(mult >= 10 ? 'win' : 'levelup'); FX.buzz([120, 60, 200]); }

      setTimeout(() => { el.remove(); done(); }, 1800); return;
    }
    delay = Math.min(420, delay * 1.12); setTimeout(step, delay);
  };
  step();
}

function localMatches() { const l = ls.get('matches', []); return Array.isArray(l) ? l : []; }
function pushLocalMatch(rec) { const l = localMatches(); l.unshift(Object.assign({ at: Date.now(), id: Date.now().toString(36) }, rec)); ls.set('matches', l.slice(0, 50)); }
// Junta a lista da nuvem com a cópia local (mesmo id = mesma partida), da mais recente para a mais antiga.
function mergeMatches(cloud, local) {

  (cloud || []).concat(local || []).forEach((r) => { if (!r || seen.has(r.id)) return; seen.add(r.id); out.push(r); });

  const note = m.querySelector('#mhn');
  if (!list.length) { note.textContent = 'Nenhuma partida ainda. Jogue uma!'; return; }
  note.textContent = fromCloud ? 'Guardadas na sua conta.' : cloudOn() ? 'Sem conexão: mostrando o que está neste aparelho.' : 'Guardadas só neste aparelho.';
  const l = m.querySelector('#mhl');
  list.forEach((r) => {
    const ps = Array.isArray(r.players) ? r.players : []; const mine = r.myTeam;
    const allBots = r.bots != null && ps.length && r.bots >= ps.length - 1;
    const sc = Array.isArray(r.scores) ? r.scores : [0, 0]; const nos = mine == null ? sc[0] : sc[mine], eles = mine == null ? sc[1] : sc[1 - mine];
    const res = r.winner == null ? ['', '—'] : r.winner === -1 ? ['', 'Empate'] : r.winner === mine ? ['v', 'Vitória'] : ['d', 'Derrota'];
    const d = document.createElement('div'); d.className = 'mh';
    d.innerHTML = `<div class="d"><span></span><span>${r.pending ? '⏳ ainda vai subir' : ''}</span></div><div class="pl2"></div><div class="sc2"><span><b>Nós ${fmtN(nos)}</b> <span class="vs">×</span> Eles ${fmtN(eles)}</span><span class="rs ${res[0]}">${res[1]}</span><span class="xg">+${+r.xp || 0} XP</span></div>`;
    d.querySelector('.d span').textContent = fmtDt(r.at || r.clientAt || 0) + ' · ' + (allBots || r.code === 'solo' ? 'Contra robôs' : 'Mesa ' + String(r.code || '').slice(0, 4)) + (r.rodadas ? ' · ' + r.rodadas + (r.rodadas > 1 ? ' rodadas' : ' rodada') : '');
    const pl = d.querySelector('.pl2');
    ps.forEach((p) => { const s = document.createElement('span'); s.textContent = p.name || '?'; if (mine != null && p.team === mine) s.className = 'me'; pl.appendChild(s); });
    l.appendChild(d);
  });
}
function cloudStart() {
  if (!CL) return;
  CL.onChange((ev) => {
    // A conta manda no código de amigo: o aparelho adota e a presença volta a subir com o código novo.
    if (ev.ucode && validCode(ev.ucode) && ev.ucode !== myCode) { myCode = ev.ucode; presenceStart(); refreshFriendsUI(); }
    if (ev.profile && window.FX) { FX.setProfile(ev.profile); paintProfile(); }
    paintAccount();
  });
  cloudName();
  CL.init();
}

presenceStart();
cloudStart();
goHome();
</script>
</body>
